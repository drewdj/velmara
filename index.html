<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velmara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#ECEEE4;--surface:#F7F8F1;--ink:#1D2520;--muted:#5A645B;--line:#C8CEBE;--accent:#8F6210;
  --display:"IM Fell English SC",Georgia,serif;--body:"Alegreya Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111713;--surface:#19211C;--ink:#E5E9DE;--muted:#97A294;--line:#2D3932;--accent:#D8A341;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto;display:grid;gap:28px}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
h1{font-size:clamp(2.4rem,8vw,3.6rem);line-height:1}
p{margin:0;color:var(--muted);max-width:56ch}
.places{display:grid;gap:10px}
a.place{display:grid;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:inherit;text-decoration:none}
a.place:hover,a.place:focus-visible{border-color:var(--accent)}
a.place h2{font-size:1.4rem}
.soon{padding:16px 18px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <header><h1>Velmara</h1><p>Lo que los aventureros pueden visitar entre sesión y sesión.</p></header>
  <div class="places">
    <a class="place" href="tienda/"><h2>Tienda de las Tres Agujas</h2><p>Aelrennor. Equipo de los Disipadores, botica y vitrina. Gasta y junta vales con el grupo.</p></a>
    <div class="soon">Más lugares, pronto.</div>
  </div>
</main>
</body>
</html>
