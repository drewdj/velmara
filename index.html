<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velmara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Overpass:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Estilo del manual de Daggerheart: páginas violeta profundo, filetes dorados con esquinas
   angulares, etiquetas doradas y cartas blancas. Interstate Condensed → Barlow Condensed; cuerpo en Overpass. */
:root{
  --night:#1B1230; --violet:#281C45; --violet-2:#33255A; --lilac:#F5EEF2; --paper:#FDFCF7;
  --gold:#F9A72B; --gold-hi:#FAC472; --gold-lo:#E08A1E; --ink:#231F20; --muted:#B9AECF; --line:#4A3B73;
  --ok:#8FD19E; --bad:#FF8A70;
  --cond:"Barlow Condensed","Interstate Condensed","Arial Narrow",sans-serif;
  --body:"Overpass","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3A2A66 0%,var(--night) 60%) fixed,var(--night);color:var(--paper);
  font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--cond);font-weight:700;margin:0;text-wrap:balance;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* Marco con esquinas doradas, como los recuadros del manual */
.deco{position:relative;background:var(--violet);border:1px solid var(--line);padding:22px 24px}
.deco::before,.deco::after{content:"";position:absolute;width:38px;height:38px;border:2px solid var(--gold);pointer-events:none}
.deco::before{top:6px;left:6px;border-right:0;border-bottom:0;clip-path:polygon(0 0,100% 0,100% 2px,10px 2px,2px 10px,2px 100%,0 100%)}
.deco::after{bottom:6px;right:6px;border-left:0;border-top:0;clip-path:polygon(100% 100%,0 100%,0 calc(100% - 2px),calc(100% - 10px) calc(100% - 2px),calc(100% - 2px) calc(100% - 10px),calc(100% - 2px) 0,100% 0)}
.tab-label{display:inline-block;justify-self:start;width:max-content;max-width:100%;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));padding:3px 14px 2px;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.black-label{display:inline-block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:2px 10px}

/* Cabecera */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px}
.brand span{font-family:var(--cond);font-weight:700;font-size:1.7rem;letter-spacing:.18em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who .nm{font-family:var(--cond);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.linkbtn{background:none;border:0;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:.9rem}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px rgb(143 209 158 / .25)}
.coins{display:inline-flex;gap:4px;align-items:center}
.coin{width:15px;height:15px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));box-shadow:inset 0 0 0 2px rgb(40 28 69 / .35)}
.coin.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.coins .n{margin-left:6px;font-size:.85rem;color:var(--muted)}

nav.main{display:flex;gap:6px;flex-wrap:wrap;padding-block:16px}
nav.main button{font-family:var(--cond);font-weight:600;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid transparent;padding:6px 16px;color:var(--muted)}
nav.main button[aria-current="true"]{color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--cond);font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--gold-hi);text-transform:uppercase;letter-spacing:.05em}
.crumbs i{font-style:normal;opacity:.6}

/* Elegir personaje */
.pick{padding-block:6vh 24px;display:grid;gap:26px}
.pick header h1{font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:.14em;text-transform:uppercase}
.pick header p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.pjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.pjcard{display:grid;gap:6px;text-align:left;padding:22px 20px 20px;background:var(--violet);border:1px solid var(--line);position:relative;min-height:170px;align-content:end}
.pjcard:hover,.pjcard:focus-visible{border-color:var(--gold)}
.pjcard .init{position:absolute;top:10px;right:16px;font-family:var(--cond);font-weight:700;font-size:4rem;line-height:1;color:var(--violet-2)}
.pjcard .nm{position:relative;font-family:var(--cond);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.04em}
.pjcard .cl{position:relative;color:var(--muted);font-size:.92rem}

/* Lugares */
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.place{display:grid;gap:10px;text-align:left;width:100%;color:inherit}
button.place:hover{border-color:var(--gold)}
.place h2{font-size:2rem;text-transform:uppercase;letter-spacing:.04em}
.place p{margin:0;color:var(--muted)}
.place.locked{background:transparent;border-style:dashed;color:var(--muted)}
.place.locked::before,.place.locked::after{border-color:var(--line)}
.notice{border-left:3px solid var(--gold);background:rgb(249 167 43 / .08);padding:8px 12px;color:var(--paper);font-size:.95rem}
.notice b{font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-hi);margin-right:6px}
.hero{display:grid;gap:10px;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);text-transform:uppercase;letter-spacing:.06em}
.hero .sub{font-family:var(--cond);font-size:1.15rem;color:var(--gold-hi);letter-spacing:.06em;text-transform:uppercase}
.hero p{margin:0;max-width:66ch;color:var(--lilac)}
.hero .quote{font-style:italic;color:var(--muted)}
.shops{display:grid;gap:12px}
.shop{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.shop .l{min-width:0;flex:1 1 260px;display:grid;gap:4px}
.shop h3{font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.state{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;padding:2px 10px;border:1px solid}
.state.open{color:var(--ok);border-color:var(--ok)}
.state.shut{color:var(--muted);border-color:var(--line)}

/* Botones */
.btn{font-family:var(--cond);font-weight:700;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;border:0;padding:7px 16px 6px;
  color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:inset 0 0 0 1.5px var(--gold);clip-path:none}
.btn.warn{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad);clip-path:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Subpestañas de la tienda */
.subtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:18px}
.subtabs button{font-family:var(--cond);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;background:var(--gold);color:var(--violet);font-size:.8rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
section.block{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:34px}
section.block>header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
section.block>header p{margin:0;color:var(--muted);font-size:.95rem}
.note{margin:0;font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}

/* Cartas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:22px 18px}
.slotcard{container-type:inline-size;display:grid;gap:8px;align-content:start;min-width:0}
.dh-card{container-type:inline-size;position:relative;width:100%;min-height:140cqw;background:#fff;color:var(--ink);border-radius:10px;
  box-shadow:0 0 0 1px rgb(249 167 43 / .55),0 10px 28px rgb(0 0 0 / .4);display:flex;flex-direction:column}
.dh-card.gone{filter:grayscale(1);opacity:.55}
.dh-card.mine{box-shadow:0 0 0 3px var(--gold),0 10px 28px rgb(0 0 0 / .4)}
.cframe{display:block;width:100%;height:auto;flex:none}
.cframe text{font-family:var(--cond)}
.c-banner{font-weight:700;font-size:31px;letter-spacing:2px;fill:var(--violet)}
.m-big{font-weight:700;font-size:46px;fill:var(--violet)}
.m-small{font-style:italic;font-weight:500;font-size:27px;fill:var(--violet)}
.cbody{flex:1;padding:0 5cqw 13cqw;margin-top:-1cqw;display:grid;align-content:start;gap:1.2cqw;font-size:4.6cqw;line-height:1.3}
.cbody h4{font-size:8.2cqw;text-align:center;color:var(--ink);letter-spacing:.01em}
.cbody .ctype{text-align:center;font-family:var(--cond);font-style:italic;font-weight:600;font-size:5.2cqw;margin-bottom:1.5cqw}
.cbody .ctrait{font-family:var(--cond);font-weight:700;font-size:6cqw}
.cbody p{margin:0}
.cbody b{font-family:var(--cond);font-weight:700;font-size:1.08em}
.hands{position:absolute;right:4cqw;bottom:3cqw;display:flex;gap:1.5cqw}
.hands svg{width:8.5cqw;height:auto;fill:#fff;stroke:#9a97a3;stroke-width:1.6}
.slots{position:absolute;right:4cqw;bottom:3.5cqw;display:grid;grid-template-columns:repeat(3,auto);gap:1.2cqw}
.slots svg{width:6cqw;height:auto;fill:#fff;stroke:#8e8b97;stroke-width:1.4}
.under{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.holder{font-size:.9rem;color:var(--muted)}
.holder b{color:var(--paper)}
.stock.zero{color:var(--bad)}

/* Botes, inventario, libro */
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.pot{display:grid;gap:10px}
.pot h3{font-size:1.4rem;text-transform:uppercase}
.bar{height:12px;background:var(--night);display:flex;border:1px solid var(--line)}
.bar span{background:linear-gradient(100deg,var(--gold-hi),var(--gold))}
.bar span+span{box-shadow:inset 2px 0 0 var(--night)}
.contrib{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;color:var(--muted)}
.contrib b{color:var(--paper)}
.rows{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--violet);border-left:3px solid var(--gold)}
.row .l{min-width:0;flex:1 1 240px}
.row .l b{font-family:var(--cond);font-size:1.15rem;letter-spacing:.02em}
.row .l small{display:block;color:var(--muted);font-size:.88rem}
select,input[type=text],input[type=search],input[type=number],input:not([type]),textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:5px 8px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--violet)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
tr:last-child td{border-bottom:0}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.93rem}
.log li{display:flex;gap:12px}
.log time{color:var(--muted);flex:none;width:44px}
.invtop{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.invtop h1{font-size:clamp(2rem,6vw,3rem);text-transform:uppercase;letter-spacing:.06em}
.ph{min-height:180px;display:grid;place-content:center;text-align:center;gap:6px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);padding:16px}
.ph b{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--paper)}
.dmgrid{display:grid;gap:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.picker{display:grid;gap:10px;margin-bottom:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,520px);
  background:var(--paper);color:var(--violet);padding:10px 18px;font-weight:600;box-shadow:0 8px 28px rgb(0 0 0 / .45)}
.toast.err{background:var(--bad);color:var(--ink)}

/* Cartas: texto sobre papel, recortado hasta que se toca */
.dh-card{background:#FBF7EE;cursor:pointer}
.cbody{background:#FBF7EE;border-radius:0 0 10px 10px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.open .clamp{-webkit-line-clamp:unset;display:block}
.clamp.en{font-size:.92em}
.spells{display:grid;gap:4px;font-size:.92em}
.spell b{display:block;font-family:var(--cond);font-size:1.05em;letter-spacing:.03em;text-transform:uppercase;color:var(--dom,#281C45)}
.spell .sd{display:none}
.open .spells{gap:10px}.open .spell .sd{display:block;margin-top:2px}
.dh-card.dom{box-shadow:0 0 0 2px var(--dom),0 10px 28px rgb(0 0 0 / .4)}
.dh-card.dom .ctype{color:var(--dom)}
.d-lv{font-family:var(--cond);font-weight:700;font-size:96px;fill:#fff}
.d-dn{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:2px;fill:#fff}
.d-rc{font-family:var(--cond);font-weight:700;font-size:44px;fill:var(--violet)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px}
.minislot{display:grid;gap:6px;align-content:start;min-width:0}
.mini{position:relative;background:#FBF7EE;color:var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgb(249 167 43 / .55),0 6px 18px rgb(0 0 0 / .35);cursor:pointer}
.mart{display:block;width:100%;height:auto;border-bottom:4px solid var(--gold)}
.qty{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--violet);font-family:var(--cond);font-weight:700;padding:1px 8px}
.mbody{padding:8px 12px 12px;display:grid;gap:2px;font-size:.85rem;line-height:1.3}
.mbody h4{font-size:1.15rem}
.mtype{font-family:var(--cond);font-style:italic;font-weight:600;color:#5A4E78}
.mbody p{margin:4px 0 0}
.minislot .btns .btn{font-size:.9rem;padding:5px 10px}
.minislot select{font-size:.85rem;padding:3px 6px}

/* Hoja de personaje */
.sheet{display:grid;gap:18px}
.idrow{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.idrow h1{font-size:clamp(2.2rem,7vw,3.4rem);text-transform:uppercase;letter-spacing:.06em}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px 16px}
.field{display:grid;gap:3px}
.field label,.lab{font-family:var(--cond);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-hi)}
.field input{width:100%}
.traits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:760px){.traits{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:400px){.traits{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trait{display:grid;justify-items:center;gap:6px;background:var(--lilac);color:var(--ink);padding:0 6px 10px;text-align:center}
.trait .black-label{width:calc(100% + 12px);font-size:.95rem}
.trait .val{font-family:var(--cond);font-weight:700;font-size:2.2rem;line-height:1}
.trait small{font-size:.75rem;color:#5A4E78;line-height:1.2}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:28px;height:28px;border:1px solid var(--line);background:var(--violet-2);color:var(--paper);font-weight:700;line-height:1;padding:0}
.trait .step button{background:#fff;color:var(--violet);border-color:#CFC3DB}
.step .v{min-width:2.2ch;text-align:center;font-family:var(--cond);font-weight:700;font-size:1.3rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.stat{display:grid;gap:8px}
.stat .big{font-family:var(--cond);font-weight:700;font-size:2.4rem;line-height:1}
.track{display:flex;flex-wrap:wrap;gap:5px}
.track button{width:26px;height:26px;padding:0;border:2px solid var(--gold);background:transparent}
.track button.on{background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo))}
.track.hope button{transform:rotate(45deg);width:22px;height:22px;margin:3px}
.track.stress button{border-color:#C8A2FF}.track.stress button.on{background:#9A6BE0}
.thresh{display:flex;align-items:stretch;flex-wrap:wrap;font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:.9rem;letter-spacing:.04em}
.thresh span{padding:6px 10px;background:var(--lilac);color:var(--ink);border-right:1px solid #CFC3DB}
.thresh b{display:block;font-size:1.5rem;line-height:1}
.thresh span.n{background:var(--ink);color:var(--paper);display:grid;place-content:center;font-size:1.3rem}
.exps{display:grid;gap:8px}
.exp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exp input{flex:1 1 200px}
@media (prefers-reduced-motion:no-preference){.pjcard,.place,.btn{transition:border-color .15s,filter .15s,opacity .15s}}


/* ---------- DM, modos y Mundo ---------- */
.dmtag{font-family:var(--cond);font-weight:700;letter-spacing:.12em;background:linear-gradient(100deg,var(--gold-hi),var(--gold-lo));color:var(--violet);padding:2px 10px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#dm-pj{font-size:.9rem;padding:3px 6px}
nav.main .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 3px rgb(143 209 158 / .25)}
.seg{display:inline-flex;border:1px solid var(--gold);align-self:end}
.seg button{background:none;border:0;padding:6px 18px;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-hi)}
.seg button[aria-selected="true"]{background:linear-gradient(100deg,var(--gold-hi),var(--gold-lo));color:var(--violet)}
.dmcard{border-style:dashed;padding:0}

/* ---------- Inventario ---------- */

/* ---------- Vista previa de enlaces (pasar el ratón; 1,5 s la fija) ---------- */
#peeks{position:fixed;inset:0;z-index:70;pointer-events:none}
.peek{position:fixed;width:min(360px,calc(100vw - 24px));max-height:min(60vh,520px);display:flex;flex-direction:column;background:var(--violet);border:1px solid var(--gold);box-shadow:0 14px 40px rgb(0 0 0 / .55);pointer-events:none;animation:peekin .12s ease-out}
.peek.pin{pointer-events:auto;box-shadow:0 0 0 1px var(--gold),0 18px 50px rgb(0 0 0 / .65)}
@keyframes peekin{from{opacity:0;transform:translateY(4px)}}
.peek .whead{cursor:default}.peek.pin .whead{cursor:move}

.mcolor{width:26px;height:26px;margin:2px auto;flex:none;border-radius:50%;background:var(--c);border:2px solid var(--line);padding:0}
.mcolor[aria-pressed="true"]{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--gold)}
.msep{display:block;height:1px;background:var(--line);margin:4px 2px;flex:none}
.map-stage{position:relative;overflow:hidden;background:#120B22;touch-action:none;user-select:none;-webkit-user-select:none}
#msvg{display:block;width:100%;height:100%;cursor:grab}
.map-shell[data-tool]:not([data-tool="mover"]) #msvg{cursor:crosshair}
.map-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.map-zoom button{width:36px;height:36px;background:var(--night);color:var(--gold-hi);border:1px solid var(--gold);font-size:1.3rem;line-height:1;padding:0}
.map-hint{position:absolute;left:10px;right:56px;bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(27,18,48,.92);border:1px solid var(--line);padding:8px 12px;font-size:.92rem}
.map-hint[hidden]{display:none}
.map-hint{pointer-events:none}.map-hint .btn{pointer-events:auto}
.map-hint span{flex:1 1 200px}
.map-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--violet)}
.mside-tabs{display:flex;border-bottom:1px solid var(--line)}
.mside-tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px 7px;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mside-tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.mside-body{overflow-y:auto;padding:12px 14px 18px;display:grid;gap:14px;align-content:start}
.mside-body section{display:grid;gap:8px}
.mside-body h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-hi)}
.mside-body h4{font-size:1rem;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.mside-body input[type=text],.mside-body textarea,.mside-body select,.mside-body input[type=number]{width:100%;box-sizing:border-box}
.mside-body input[type=number]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:5px 8px}
.mside-body textarea{min-height:90px;resize:vertical}
.mside-body input[type=range]{width:100%;accent-color:var(--gold)}
.mlab{font-family:var(--cond);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.mrow{display:grid;gap:6px}
.micons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.micons button{aspect-ratio:1;background:var(--night);border:1px solid var(--line);padding:5px;display:grid;place-items:center}
.micons button svg{width:100%;height:100%;fill:var(--paper);stroke:var(--paper);stroke-width:.6}
.micons button[aria-pressed="true"]{border-color:var(--gold);background:var(--violet-2)}
.mcolors{display:flex;flex-wrap:wrap;gap:4px}.mcolors .mcolor{margin:2px}
.mglist{display:grid;gap:4px}
.mgroup{display:flex;align-items:center;gap:8px;background:var(--night);border:1px solid var(--line);padding:6px 10px;text-align:left}
.mgroup i{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--paper)}
.mgroup span{flex:1;font-family:var(--cond);font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.mgroup small{color:var(--muted)}
.mgroup[aria-pressed="true"]{border-color:var(--gold)}
.mgsel{border-top:1px solid var(--line);padding-top:12px}
.metapas{margin:0;padding-left:22px;font-size:.92rem}
.m-label{font-family:var(--cond);font-weight:700;fill:#FDFCF7;paint-order:stroke;stroke:#1B1230;stroke-width:.25em;stroke-linejoin:round;pointer-events:none}
.m-etapa{fill:#FAC472}
.m-ini{font-family:var(--cond);font-weight:700;fill:#1B1230;pointer-events:none}
.m-text{font-family:var(--cond);font-weight:700;paint-order:stroke;stroke:#1B1230;stroke-width:.18em;stroke-linejoin:round}
.m-pin,.m-text,.m-imgw,.m-token,.m-hit{cursor:pointer}
.m-sel{filter:drop-shadow(0 0 3px #FAC472) drop-shadow(0 0 6px #F9A72B)}
@media (max-width:860px){
  .map-shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62dvh auto;height:auto}
  .map-tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .mcolor{margin:auto 2px}.msep{width:1px;height:auto;margin:2px 4px}
  .map-side{border-left:0;border-top:1px solid var(--line)}
  .mside-body{overflow:visible}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="maproot" hidden></div>
<div id="mundoroot" hidden></div>
<div id="peeks"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=18"></script>
<script src="js/datos.js?v=18"></script>
<script src="js/dominios.js?v=18"></script>
<script src="js/reglas.js?v=18"></script>
<script src="js/store.js?v=18"></script>
<script src="js/cartas.js?v=18"></script>
<script src="js/mapa.js?v=18"></script>
<script src="js/contenido.js?v=18"></script>
<script src="js/saber.js?v=18"></script>
<script src="js/mundo.js?v=18"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const TAB=Math.random().toString(36).slice(2);
const ui={dtab:ls.get("v-dtab"),ccol:ls.get("v-ccol"),cid:null,cq:"",cdraft:null,cimg:undefined,cconfirm:false,ct:ls.get("v-ct"),lg:ls.get("v-lg"),me:ls.get("v-pj"),view:ls.get("v-view")||"personaje",ent:ls.get("v-ent"),cat:ls.get("v-cat"),tienda:ls.get("v-tienda"),
  stab:ls.get("v-stab")||"equipo",pick:null,allDoms:false,filt:"todo",wf:"fis",busy:false,canDM:false,confirmReset:false,confirmHide:false,
  edit:{hoja:false,inv:false},sel:null,login:false,loginErr:""};
if(!PJ[ui.me])ui.me=null;
function go(patch){Object.assign(ui,patch);["view","ent","cat","tienda","stab"].forEach(k=>ls.set("v-"+k,ui[k]));ui.confirmReset=false;render();scrollTo({top:0})}

let toastT;
function toast(m,err){const t=$("#toast");t.textContent=m;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}
async function act(fn,ok){
  if(ui.busy)return;ui.busy=true;render();
  try{await Store.mutate(st=>fn(st));if(ok)toast(ok)}
  catch(e){toast(e instanceof Nope?e.message:"No se pudo guardar. Revisa la conexión y prueba otra vez.",true);if(!(e instanceof Nope))console.error(e)}
  finally{ui.busy=false;render()}
}
const coins=(n,max)=>{let h="";const m=Math.max(n,max||0);for(let i=0;i<Math.min(m,8);i++)h+=`<span class="coin${i<n?"":" off"}"></span>`;return `<span class="coins">${h}<span class="n num">${n} vale${n===1?"":"s"}</span></span>`};
const dis=c=>c||ui.busy?"disabled":"";
const MARK=`<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAC472"/><stop offset="1" stop-color="#E08A1E"/></linearGradient></defs><path d="M20 2 L36 11 V29 L20 38 L4 29 V11Z" fill="none" stroke="url(#mg)" stroke-width="2.5"/><path d="M20 9 L28 20 L20 31 L12 20Z" fill="url(#mg)"/></svg>`;

/* ---------- Cabecera y navegación ---------- */
function header(st){
  const me=ui.me&&st?.pjs?.[ui.me];
  const lt={live:"En vivo",local:"Modo prueba",wait:"Conectando…",error:"Sin conexión",offline:"Reconectando…"}[Store.mode];
  const inShop=ui.view==="mundo"&&ui.tienda&&me; // los vales solo pintan algo dentro de la tienda
  const who=ui.canDM?`<span class="dmtag">DM</span><select id="dm-pj" aria-label="Ver la hoja de"><option value="">Ver la hoja de…</option>${PJS.map(p=>`<option value="${p.id}" ${p.id===ui.me?"selected":""}>${esc(p.n)}</option>`).join("")}</select>${inShop?coins(me.vales,3):""}<button class="linkbtn" data-logout>Salir</button>`
    :ui.me?`<span class="nm">${esc(PJ[ui.me].n)}</span>${inShop?coins(me.vales,3):""}<button class="linkbtn" data-switch>Cambiar personaje</button>`:"";
  return `<header class="top"><button class="brand" data-home>${MARK}<span>Velmara</span></button>
   <div class="who">${who}<span class="live${Store.mode==="live"?" on":""}"><i></i>${lt}</span></div></header>`;
}
const openShops=st=>LUGARES.flatMap(l=>st.mundo.lugares[l.id]?.visible?l.tiendas.filter(t=>st.mundo.tiendas[t.id]?.abierta).map(t=>({l,t})):[]);
function nav(st){
  const T=[...(ui.me?[["personaje","Personaje"],["inventario","Inventario"],["contactos","Contactos"],["lugares","Lugares"]]:[]),["mundo","Mundo"],["mapa","Mapa"],...(ui.canDM?[["dm","Mesa del DM"]]:[])];
  const dot=openShops(st).length?`<i class="dot" title="Hay algo abierto"></i>`:"";
  return `<nav class="main">${T.map(([k,l])=>`<button data-view="${k}" aria-current="${ui.view===k}">${l}${k==="mundo"?dot:""}</button>`).join("")}</nav>`;
}
const seg=k=>`<div class="seg" role="tablist" aria-label="Modo"><button role="tab" data-mode="${k}" data-v="0" aria-selected="${!ui.edit[k]}">Ver</button><button role="tab" data-mode="${k}" data-v="1" aria-selected="${!!ui.edit[k]}">Editar</button></div>`;

/* ---------- Elegir personaje (o entrar como DM) ---------- */
function viewPick(){
  return `<div class="pick"><header><span class="tab-label">Antes de entrar</span><h1>¿Quién eres?</h1>
   <p>Elige tu personaje. Se queda guardado en este dispositivo para todo lo que hagas: hoja, inventario y compras.</p></header>
   <div class="pjs">${PJS.filter(p=>!p.prueba).map(p=>`<button class="pjcard deco" data-me="${p.id}">${p.img?`<img class="init pimg" src="${p.img}" alt="">`:`<span class="init" aria-hidden="true">${esc(p.n[0])}</span>`}
     <span class="nm">${esc(p.n)}</span><span class="cl">${esc(p.c)}<br>Jugador: ${esc(p.j)}</span></button>`).join("")}
    <div class="pjcard deco dmcard">${ui.login?`<form id="dmform" class="dmform"><span class="nm">DM</span><label class="note" for="dm-pw">Contraseña</label>
      <input type="password" id="dm-pw" autocomplete="current-password" required><div class="btns"><button class="btn" type="submit" ${dis()}>Entrar</button><button class="btn ghost" type="button" data-login="0">Cancelar</button></div>
      ${ui.loginErr?`<p class="err">${esc(ui.loginErr)}</p>`:""}</form>`
     :`<button class="dmopen" data-login="1"><span class="init" aria-hidden="true">✦</span><span class="nm">Soy el DM</span><span class="cl">Pide contraseña</span></button>`}</div></div></div>`;
}

/* ---------- Mundo: lo que sabe cada personaje ---------- */
// Entradas que ve quien mira: el DM todas (notas del vault y lugares); un PJ, lo compartido con él y los lugares abiertos
function loreFor(st){
  const E={};
  if(ui.canDM){for(const [id,e] of Object.entries(Saber.dm))E[id]={...e,dm:true}}
  else for(const [id,e] of Object.entries(Saber.visibleFor(ui.me)))E[id]={...e};
  for(const l of LUGARES)if(ui.canDM||st.mundo.lugares[l.id]?.visible)E[l.id]=E[l.id]||{n:l.n,cat:"lugares",sub:l.sub,txt:l.desc,pub:l.desc};
  return E;
}
const plain=s=>String(s||"").replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,a,b)=>b||a).replace(/[*#>_]/g,"").replace(/(^|\n)\s*([-•]|\d+\.)\s+/g,"$1").replace(/\s+/g," ").trim();
function whoSees(id){const p=Saber.pub[id]?.para;if(!p)return "Nadie";if(p.todos)return "Todos";const n=PJS.filter(x=>p[x.id]).map(x=>x.n);return n.length?n.join(", "):"Nadie"}
// Mundo = mapa de Velmara de fondo (js/mundo.js). Aquí solo queda la tienda, que es una pantalla aparte.
function viewMundo(st){
  if(ui.tienda&&TIENDA[ui.tienda]&&(st.mundo.lugares[TIENDA[ui.tienda].lugar]?.visible||ui.canDM))return viewTienda(st,ui.tienda);
  ui.tienda=null;return "";
}
// Lo que pinta el mapa: entradas con su marcador (pos) y, para el DM, si aún no lo ve nadie (oculto)
function mundoEntries(){
  const st=Store.state;if(!st)return {};
  const E=loreFor(st);
  for(const [id,e] of Object.entries(E)){
    e.pos=ui.canDM?Saber.posOf(id):(e.pos||DEF_POS[id]||null);
    if(ui.canDM)e.oculto=!Saber.pub[id]&&!(LUGARES.some(l=>l.id===id)&&st.mundo.lugares[id]?.visible);
  }
  return E;
}
function mundoNow(){
  const st=Store.state;if(!st)return "";
  return openShops(st).map(({l,t})=>`<div class="wnowcard"><span class="live on"><i></i>Abierta</span><b>${esc(t.n)}</b><span class="note">${esc(l.n)}</span><button class="btn" data-tienda="${t.id}">Entrar</button></div>`).join("");
}
// Contenido de una ventana: la nota (con enlaces que abren otras ventanas), sus tiendas y, para el DM, quién la ve
function entryBody(id){
  const st=Store.state,E=mundoEntries(),e=E[id];if(!e)return "";
  const link=(t,txt)=>E[t]?`<button class="lk" data-ent="${t}">${esc(txt)}</button>`:`<span class="lk off">${esc(txt)}</span>`;
  const l=LUGARES.find(x=>x.id===id),lm=l&&st.mundo.lugares[id];
  const shops=l&&(lm?.visible||ui.canDM)?`${lm.nota?`<div class="notice"><b>Aviso</b>${esc(lm.nota)}</div>`:""}<div class="wshops">${l.tiendas.map(t=>{const s=st.mundo.tiendas[t.id];
     return `<div class="wshop"><div><b>${esc(t.n)}</b><span class="note">${esc(t.sub)}</span></div><span class="state ${s.abierta?"open":"shut"}">${s.abierta?"Abierta":"Cerrada"}</span>${s.abierta||ui.canDM?`<button class="btn" data-tienda="${t.id}">Entrar</button>`:""}</div>`}).join("")}</div>`:"";
  const meta=(e.img?`<img class="wimg" src="${e.img}" alt="">`:"")+(e.estado?`<p class="note">${esc(e.estado)}</p>`:"");
  if(!ui.canDM)return meta+`<article class="prose">${mdHTML(e.txt||"",link)}</article>`+shops;
  const pub=Saber.pub[id],para=pub?.para||{};
  const share=e.dm?`<details class="wshare" ${pub?"":"open"}><summary>Lo ve: <b>${esc(whoSees(id))}</b></summary>
     <div class="chips"><button class="chip" data-para="todos" data-id="${id}" aria-pressed="${!!para.todos}">Todos</button>${PJS.filter(p=>!p.prueba).map(p=>`<button class="chip" data-para="${p.id}" data-id="${id}" aria-pressed="${!!(para.todos||para[p.id])}" ${para.todos?"disabled":""}>${esc(p.n)}</button>`).join("")}</div>
     <label class="lab" for="sh-${id}">Texto que les llega</label><textarea id="sh-${id}" class="shtxt">${esc(pub?pub.txt:e.pub||"")}</textarea>
     <div class="btns"><button class="btn" data-shsave="${id}" ${dis()}>Guardar texto</button><button class="btn ghost" data-shreset="${id}">Texto de la nota</button>${pub?`<button class="btn warn" data-shoff="${id}">Ocultar</button>`:""}</div></details>`:"";
  const mk=`<div class="btns wmk">${e.pos?`<span class="note">Arrastra el marcador o</span><button class="btn ghost" data-wplace="${id}">Mover en el mapa</button><button class="btn ghost" data-wunplace="${id}">Quitar del mapa</button>`:`<button class="btn ghost" data-wplace="${id}">Poner en el mapa</button>`}</div>`;
  return share+mk+meta+`<article class="prose">${mdHTML(e.txt||"",link)}</article>`+shops;
}

/* ---------- Tienda ---------- */
function viewTienda(st,id){
  const t=TIENDA[id],l=LUGARES.find(x=>x.id===t.lugar),s=st.mundo.tiendas[id];
  const crumbs=`<div class="crumbs"><button data-ent="">Mundo</button><i>/</i><button data-ent="${l.id}">${esc(l.n)}</button><i>/</i><span>${esc(t.n)}</span></div>`;
  const hero=`<div class="hero"><span class="sub">${esc(t.sub)}</span><h1>${esc(t.n)}</h1><p>${esc(t.desc)}</p><p class="quote">«${esc(t.cita)}»</p>${s.nota?`<div class="notice"><b>Aviso</b>${esc(s.nota)}</div>`:""}</div>`;
  if(!s.abierta&&!ui.canDM)return crumbs+hero+`<div class="deco"><h2>Cerrada</h2><p class="note">La encargada ha echado el cierre. Volved cuando el DM la abra.</p></div>`;
  // El DM puede mirar siempre; para comprar o coger equipo elige antes un PJ
  const dmNote=ui.canDM&&(!s.abierta||!ui.me)?`<div class="notice"><b>DM</b>${!s.abierta?"Está cerrada: los jugadores no pueden entrar. ":""}${!ui.me?"Solo mirando. Para comprar o coger equipo por un PJ, elígelo arriba en «Ver la hoja de…».":""}</div>`:"";
  const nb=Object.keys(st.botes).length;
  const T=[["equipo","Entrega de equipo"],["botin","Botín y botica"],["botes",`Botes${nb?`<span class="badge num">${nb}</span>`:""}`],["libro","Libro de cuentas"],...(ui.canDM?[["dm","Mostrador · DM"]]:[])];
  const V={equipo:tabEquipo,botin:tabBotin,botes:tabBotes,libro:tabLibro,dm:ui.canDM?st=>tabDM(st,id):tabEquipo}[ui.stab]||tabEquipo;
  return crumbs+hero+dmNote+`<nav class="subtabs" role="tablist">${T.map(([k,lab])=>`<button role="tab" data-stab="${k}" aria-selected="${ui.stab===k}">${lab}</button>`).join("")}</nav>`+V(st);
}
const NOPJ={vales:0,inv:{},arma:null,sec:null,armadura:null,bolsa:[],propios:{}};
function gearSlot(st,slot,g){
  const h=holderOf(st,slot,g.id),mine=!!ui.me&&h===ui.me,me=st.pjs[ui.me]||NOPJ;
  const twoBlock=slot==="sec"&&me.arma&&gearInfo(st,ui.me,me.arma)?.h===2;
  const card=(slot==="armadura"?armorCard(g):weaponCard(g)).replace('class="dh-card"',`class="dh-card${h&&!mine?" gone":""}${mine?" mine":""}"`);
  let btn="";
  if(mine)btn=`<button class="btn ghost" data-devolver="${g.id}" ${dis()}>Devolver</button>`;
  else if(!h)btn=`<button class="btn" data-equip="${slot}" data-id="${g.id}" ${dis(twoBlock)}>${me[slot]?"Cambiar":"Elegir"}</button>`;
  if(!ui.me)btn="";
  const who=h?(mine?(me[slot]===g.id?"<b>La llevas tú</b>":"<b>En tu bolsa</b>"):`La lleva <b>${esc(PJ[h].n)}</b>`):twoBlock?"Tu arma es a dos manos":"Libre";
  return `<div class="slotcard">${card}<div class="under"><span class="holder">${who}</span>${btn}</div></div>`;
}
function tabEquipo(st){
  const F=[["fis","Armas físicas"],["mag","Armas mágicas"],["sec","Secundarias"],["arm","Armaduras"]];
  let head,cards;
  if(ui.wf==="arm"){head=["Armaduras de tier 2","Umbrales finales = base + nivel."];cards=ARMORS.map(a=>gearSlot(st,"armadura",a))}
  else{const slot=ui.wf==="sec"?"sec":"arma";
    head={fis:["Armas principales físicas","Versiones de tier 2."],mag:["Armas principales mágicas","Requieren rasgo de lanzamiento."],sec:["Armas secundarias","No se pueden llevar con un arma principal a dos manos."]}[ui.wf];
    cards=WEAPONS.filter(w=>w.g===ui.wf).map(w=>gearSlot(st,slot,w))}
  return `<p class="note" style="margin-bottom:14px">Regalo de los Disipadores: un arma principal, una secundaria y una armadura por PJ. Hay una sola pieza de cada; lo que coge uno no lo puede coger otro hasta que lo devuelva.</p>
   <div class="chips">${F.map(([k,l])=>`<button class="chip" data-wf="${k}" aria-pressed="${ui.wf===k}">${l}</button>`).join("")}</div>
   <section class="block"><header><span class="tab-label">${head[0]}</span><p>${head[1]}</p></header><div class="cards">${cards.join("")}</div></section>`;
}
function lootSlot(st,it){
  const me=st.pjs[ui.me]||NOPJ,left=it.s==null?null:st.stock[it.id]??0,p=price(it),have=me.inv[it.id]||0,gone=left===0;
  const stockTxt=it.s==null?(have?"Ya la conoces":"Se aprende, no se agota"):gone?"Agotado":`Quedan <span class="num">${left}</span> de ${it.s}`;
  const blocked=gone||(it.k==="rec"&&have)||!ui.me;
  const card=itemCard(it).replace('class="dh-card',`class="dh-card${gone?" gone":""}`);
  return `<div class="slotcard">${card}<div class="under"><span class="holder stock${gone?" zero":""}">${stockTxt}${have&&it.k!=="rec"?` · llevas ${have}`:""}</span>
   ${blocked?"":`<span class="btns"><button class="btn" data-buy="${it.id}" ${dis(me.vales<p)}>Comprar</button>${p>1?`<button class="btn ghost" data-pot="${it.id}" ${dis(me.vales<1)}>Bote</button>`:""}</span>`}</div></div>`;
}
function tabBotin(st){
  const F=[["todo","Todo"],["c","Comunes · 1"],["pc","Poco comunes · 2"],["rec","Recetas"],["r","Vitrina · 4"]];
  const G=[["c","Planta baja · Comunes","1 vale cada uno."],["pc","Planta media · Poco comunes","2 vales cada uno."],

/* ---------- Inventario: huecos de equipo, bolsa y objetos ---------- */
const PTIPO={obj:"Objeto",cons:"Consumible",pri:"Arma principal",sec:"Arma secundaria",arm:"Armadura"};
const SLOTN={arma:"Arma principal",sec:"Arma secundaria",armadura:"Armadura"};
// Todo lo que lleva un PJ como fichas: piezas (ref) y objetos de la tienda (inv)
function owned(st,pj){
  const s=st.pjs[pj],eq=new Set([s.arma,s.sec,s.armadura]),L=[];
  s.bolsa.forEach(r=>L.push({ref:r,g:gearInfo(st,pj,r),q:1}));
  Object.entries(s.propios).forEach(([id,o])=>{const r="p:"+id;if(!eq.has(r))L.push({ref:r,g:gearInfo(st,pj,r),q:o.q||1,o})});
  Object.keys(s.inv).sort((a,b)=>ITEMS.indexOf(ITEM[a])-ITEMS.indexOf(ITEM[b])).forEach(id=>L.push({ref:"i:"+id,it:ITEM[id],q:s.inv[id]}));
  return L;
}
function tileArt(x){
  let glyph,tint;
  if(x.it){glyph=glyphFor("item",x.it.id,x.it);tint=TINT[x.it.r]}
  else if(x.g?.w){glyph=glyphFor("arma",x.g.w.id);tint=TINT[x.g.w.d.includes("mág")?"mag":"fis"]}
  else if(x.g?.a){glyph="armadura";tint=TINT.arm}
  else{const t=x.o?.tipo;glyph={pri:"espada",sec:"daga",arm:"armadura",cons:"pocion"}[t]||"objeto";tint=TINT[{pri:"fis",sec:"fis",arm:"arm",cons:"c"}[t]||"pc"]}
  return `<svg class="tart" viewBox="0 0 120 120" aria-hidden="true">${scene(120,120,tint,glyph,x.it?ARTE[x.it.id]:x.g?.w?ARTE[x.g.w.id]:null,{cy:58,size:70})}</svg>`;
}
const nameOf=x=>x.it?cap(x.it.n.replace("Receta: ","")):x.g?.n||x.o?.n||"?";
function tile(x,where){
  const fits=x.g?.slot||"",sel=ui.sel===x.ref;
  return `<button class="tile${sel?" sel":""}" data-ref="${esc(x.ref)}" data-fits="${fits}" data-where="${where}" ${fits?"data-drag":""} aria-pressed="${sel}">
    ${tileArt(x)}${x.q>1?`<span class="qty num">×${x.q}</span>`:""}<span class="tn">${esc(nameOf(x))}</span></button>`;
}
function fullCard(st,pj,x){
  if(x.it)return itemCard(x.it);
  if(x.g?.w)return weaponCard(x.g.w);
  if(x.g?.a)return armorCard(x.g.a);
  const o=x.o||st.pjs[pj].propios[x.ref.slice(2)];
  return `<div class="pcard deco"><span class="black-label">${PTIPO[o.tipo]||"Objeto"}${o.h===2?" · dos manos":""}</span><h3>${esc(o.n)}</h3>${o.d?`<p class="pre">${esc(o.d)}</p>`:`<p class="empty">Sin descripción.</p>`}</div>`;
}
function viewInventario(st){
  const p=PJ[ui.me],s=st.pjs[ui.me],h=st.hojas[ui.me];
  const top=`<div class="hero idrow"><div><span class="sub">${esc(CLASES[h.clase].n)} · ${esc(p.j)}</span><h1>${esc(p.n)}</h1></div>${seg("inv")}</div>`;
  const L=owned(st,ui.me);
  if(ui.edit.inv)return top+invEditar(st,s,L);
  const all=[...L];["arma","sec","armadura"].forEach(k=>{if(s[k])all.push({ref:s[k],g:gearInfo(st,ui.me,s[k]),q:1,o:s[k].startsWith("p:")?s.propios[s[k].slice(2)]:null})});
  const selX=ui.sel&&all.find(x=>x.ref===ui.sel);if(ui.sel&&!selX)ui.sel=null;
  const eslot=k=>{const r=s[k],x=r&&all.find(y=>y.ref===r),can=selX&&selX.g?.slot===k&&selX.ref!==r;
    return `<div class="eslot${can?" can":""}" data-drop="${k}"><span class="elab">${SLOTN[k]}</span>${x?tile(x,k):`<button class="tile empty" data-slotpick="${k}" ${can?"":"tabindex=\"-1\""}><span class="tn">Vacío</span></button>`}</div>`};
  const bolsaN=s.bolsa.length;
  let det="";
  if(selX){const eqd=["arma","sec","armadura"].find(k=>s[k]===selX.ref),btn=[];

function compList(col){

async function compSave(){
  const col=ui.ccol,id=ui.cid,r=compRec(col,id),D=ui.cdraft||{},lore=isLore(col);
  const o={...r};for(const [k,v] of Object.entries(D))o[k]=v;
  if(ui.cimg!==undefined){if(ui.cimg)o.img=ui.cimg;else delete o.img}
  o.n=String(o.n||"").trim().slice(0,80);if(!o.n){toast("Ponle un nombre.",true);return}
  for(const k of ["sc","h"])if(k in o&&o[k]!=="")o[k]=+o[k];
  for(const k of ["s","p"])if(k in o){if(o[k]===""||o[k]==null)delete o[k];else o[k]=Math.max(0,+o[k])}
  let nid=id;
  if(id==="__new"){const base=slugN(o.n)||"nuevo",taken=k=>lore?Saber.dm[k]:COLS[col].map[k]||(col==="armas"&&ARMOR[k]);nid=base;for(let i=2;taken(nid);i++)nid=base+"-"+i}
  ui.busy=true;render();
  try{
    if(lore){const pubTxt=o.pub;if(o.cat==="personas"&&!o.tipo)o.tipo="npc";await Saber.guardar(nid,o,pubTxt);if(o.cat!==col)ui.ccol=o.cat}
    else{delete o.id;delete o.nuevo;await Contenido.guardar(col,nid,o)}
    ui.cid=nid;ui.cdraft=null;ui.cimg=undefined;toast(id==="__new"?"Creado.":"Guardado.");
  }catch(e){console.error(e);toast("No se pudo guardar. ¿Sigue abierta la sesión de DM?",true)}
  ui.busy=false;render();
}

/* ---------- Mapa (vive fuera de #app para no perder lo dibujado en cada render) ---------- */
let mapMounted=false;
function showMap(on){
  const r=$("#maproot");if(r.hidden===!on&&!(on&&!mapMounted))return;
  r.hidden=!on;if(!on)return;
  if(!mapMounted){mapMounted=true;Mapa.mount(r,{me:()=>ui.me,isDM:()=>ui.canDM,pjName:id=>PJ[id]?.n,
    lugares:()=>LUGARES.filter(l=>Store.state?.mundo?.lugares?.[l.id]?.visible||ui.canDM),
    goLugar:id=>go({view:"mundo",ent:id,tienda:null}),toast})}
  else Mapa.refresh();
}

/* ---------- Mundo (también fuera de #app: las ventanas abiertas sobreviven a cada render) ---------- */
let mundoMounted=false;
function showMundo(on){
  const r=$("#mundoroot");r.hidden=!on;if(!on)return;
  if(!mundoMounted){mundoMounted=true;Mundo.mount(r,{entries:mundoEntries,body:entryBody,nowHTML:mundoNow,isDM:()=>ui.canDM,
    setPos:(id,x,y)=>Saber.setPos(id,x,y).catch(e=>{console.error(e);toast("No se pudo guardar el marcador.",true)})})}
  else Mundo.refresh();
}

/* ---------- Render ---------- */
function render(){
  const st=Store.state,app=$("#app");
  let body;
  if(Store.mode==="wait")body=`<div class="deco" style="margin-top:24px"><h2>Abriendo la puerta…</h2><p class="note">Cargando el estado de la partida.</p></div>`;
  else if(Store.mode==="error"&&!st)body=`<div class="deco" style="margin-top:24px"><h2>No hay conexión</h2><p class="note">Recarga la página. Si sigue igual, avisa al DM.</p></div>`;
  else if(!ui.me&&!ui.canDM)body=viewPick();
  else if(!st)body=`<div class="deco" style="margin-top:24px"><h2>La partida aún no ha empezado</h2><p class="note">El DM tiene que prepararla: cinco PJs con 3 vales y la tienda llena.</p>
    ${ui.canDM?`<div class="btns" style="margin-top:12px"><button class="btn" data-start ${dis()}>Empezar partida</button></div>`:""}</div>`;
  else{
    if(!ui.me&&["personaje","inventario","contactos","lugares"].includes(ui.view))ui.view="mundo";
    if(ui.view==="dm"&&!ui.canDM)ui.view="personaje";
    const V={mundo:viewMundo,personaje:viewPersonaje,inventario:viewInventario,contactos:viewContactos,lugares:viewLugares,dm:viewDM,mapa:()=>""}[ui.view]||viewMundo;
    body=nav(st)+V(st);
  }
  showMap(!!(st&&(ui.me||ui.canDM)&&ui.view==="mapa"));
  showMundo(!!(st&&(ui.me||ui.canDM)&&ui.view==="mundo"&&!ui.tienda));
  const ae=document.activeElement;let sel=null;try{sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  const keep=["TEXTAREA","INPUT"].includes(ae?.tagName)&&ae.type!=="checkbox"&&ae.id?{id:ae.id,v:ae.value,sel}:null;
  app.innerHTML=header(st)+body;
  // Al redibujar, lo que se estaba escribiendo conserva el foco y la posición del cursor
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();if(keep.sel?.[0]!=null)try{el.setSelectionRange(keep.sel[0],keep.sel[1])}catch(e){}}}
}

/* Arrastrar fichas del inventario a los huecos (ratón y dedo). En táctil hay que mantener pulsado un momento,
   para que deslizar siga moviendo la página. */
// En los mapas, arrastrar no debe seleccionar texto ni (en el móvil) abrir el menú de copiar/buscar
const onMapSvg=t=>t.closest?.("#msvg,#wsvg");
document.addEventListener("pointerdown",e=>{if(onMapSvg(e.target)){window.getSelection()?.removeAllRanges();if(e.pointerType==="mouse")e.preventDefault()}},true);
document.addEventListener("contextmenu",e=>{if(onMapSvg(e.target)||e.target.closest?.("[data-cdrag],.tile[data-drag]"))e.preventDefault()});
document.addEventListener("selectstart",e=>{if(onMapSvg(e.target))e.preventDefault()});
let drag=null,noClick=false;
document.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tile[data-drag],[data-cdrag]");if(!t||ui.busy||e.button>0)return;
  const card=t.dataset.cdrag;
  drag={t,card,ref:card||t.dataset.ref,fits:t.dataset.fits,where:t.dataset.where,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,
    timer:e.pointerType==="touch"?setTimeout(()=>{if(drag&&!drag.on)startDrag(drag.x,drag.y)},260):0,touch:e.pointerType==="touch"};
});
function startDrag(x,y){
  drag.on=true;const r=drag.t.getBoundingClientRect(),g=drag.t.cloneNode(true);
  g.className=(drag.card?"slotcard":"tile")+" ghost";g.style.width=r.width+"px";document.body.appendChild(g);drag.g=g;drag.ox=r.width/2;drag.oy=Math.min(r.height/2,60);moveGhost(x,y);
  if(drag.card){document.querySelector(`.cdrop[data-drop="${drag.where==="uso"?"baul":"uso"}"]`)?.classList.add("can");drag.t.classList.add("lifted");return}
  document.querySelectorAll(`.eslot[data-drop="${drag.fits}"]`).forEach(s=>s.classList.add("can"));
  if(drag.where!=="lista")document.querySelector('.tiles[data-drop="lista"]')?.classList.add("can");
}
function moveGhost(x,y){drag.g.style.transform=`translate(${x-drag.ox}px,${y-drag.oy}px)`;drag.x=x;drag.y=y;
  document.querySelectorAll("[data-drop].over").forEach(z=>z.classList.remove("over"));
  drag.g.hidden=true;const z=document.elementFromPoint(x,y)?.closest("[data-drop].can");drag.g.hidden=false;if(z)z.classList.add("over")}
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){const far=Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6;
    if(drag.touch){if(far){clearTimeout(drag.timer);drag=null}return}
    if(far)startDrag(e.clientX,e.clientY);else return}
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener("touchmove",e=>{if(drag?.on)e.preventDefault()},{passive:false});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;clearTimeout(drag.timer);const d=drag;drag=null;
  if(!d.on)return;noClick=true;setTimeout(()=>noClick=false,50);
  d.g.hidden=true;const z=document.elementFromPoint(d.x,d.y)?.closest("[data-drop].can");d.g.remove();
  document.querySelectorAll(".can,.over,.lifted").forEach(x=>x.classList.remove("can","over","lifted"));
  if(!z)return;const to=z.dataset.drop;
  if(d.card){if(to!==d.where)act(st=>A.hoja(st,ui.me,h=>{const id=d.card;
    if(to==="uso"){if(h.cartas.length>=5)no("Ya tienes 5 cartas en la mano: guarda antes una en el baúl.");h.baul=h.baul.filter(x=>x!==id);h.cartas.push(id)}
    else{h.cartas=h.cartas.filter(x=>x!==id);h.baul.push(id)}}),to==="uso"?"A la mano.":"Al baúl.");return}
  if(to==="lista"){if(d.where!=="lista")act(st=>A.slot(st,ui.me,d.ref,null))}
  else if(to!==d.where)act(st=>A.slot(st,ui.me,d.ref,to));
}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",e=>{if(drag&&!drag.on)endDrag(e)});

async function dmSave(id,para,txt,ok){
  if(ui.busy)return;ui.busy=true;render();
  try{await Saber.share(id,para,txt);toast(ok)}catch(e){console.error(e);toast("No se pudo guardar. ¿Sigue abierta la sesión de DM?",true)}
  finally{ui.busy=false;render()}
}

  if(t.id==="import-file"){const f=t.files[0];t.value="";if(!f)return;
    f.text().then(x=>Saber.importar(JSON.parse(x))).then(n=>toast(`${n} notas importadas.`)).catch(err=>{console.error(err);toast(err instanceof SyntaxError?"Ese archivo no es el del vault.":err.message||"No se pudo importar.",true)});return}
  if(t.dataset?.pf){const [id,k]=t.dataset.pf.split("."),v=k==="h"?+t.value:t.value.slice(0,k==="d"?400:60);act(st=>A.propio(st,ui.me,id,{[k]:v}),"Guardado.");return}
  if(t.dataset?.hfield){const k=t.dataset.hfield,v=t.value.slice(0,k==="notas"?2000:60);act(st=>A.hoja(st,ui.me,h=>{h[k]=v}),"Guardado.");return}
  if(t.dataset?.hexp!==undefined){const i=+t.dataset.hexp,v=t.value.slice(0,60);act(st=>A.hoja(st,ui.me,h=>{if(h.exp[i])h.exp[i].n=v}),"Guardado.");return}
  if(t.dataset?.lvis)act(st=>A.lugar(st,t.dataset.lvis,{visible:t.checked}),t.checked?"Lugar visible.":"Lugar oculto.");
});

// El DM entra con su contraseña; la sesión la guarda Firebase en este navegador
/* Vista previa de los enlaces [[…]]: al pasar el ratón sale la ficha; si se mantiene 1,5 s se queda fija
   (se puede mover por la cabecera y leer con calma). Solo con ratón; en táctil el toque sigue abriendo el Mundo. */
const Peek=(()=>{
  const root=$("#peeks"),HOLD=1500;let cur=null; // cur: {a,el,ring,t}
  function html(id){
    const e=mundoEntries()[id];if(!e)return null;const E=mundoEntries();
    const link=(t,txt)=>E[t]?`<button class="lk" data-ent="${t}">${esc(txt)}</button>`:`<span class="lk off">${esc(txt)}</span>`;
    return `<div class="whead"><b>${esc(e.n)}</b><button class="wx pclose" data-pclose aria-label="Cerrar">✕</button></div>
     <div class="wbody">${e.img?`<img class="wimg" src="${e.img}" alt="">`:""}${e.sub?`<p class="note psub">${esc(e.sub)}</p>`:""}${e.estado?`<p class="note">${esc(e.estado)}</p>`:""}<article class="prose">${mdHTML(e.txt||"",link)||`<p class="note">Sin más datos.</p>`}</article>
     <div class="btns"><button class="btn ghost" data-ent="${id}">Abrir en el Mundo</button></div></div>`;
  }
  function place(el,a){
    const r=a.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+8;
    if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
    el.style.left=x+"px";el.style.top=y+"px";
  }
  function stop(){if(!cur)return;clearTimeout(cur.t);cur.el?.remove();cur.ring?.remove();cur=null}
  function start(a,ev){
    const h=html(a.dataset.ent);if(!h)return;
    const el=document.createElement("div");el.className="peek";el.innerHTML=h;root.append(el);place(el,a);
    const ring=document.createElement("div");ring.className="peekring";ring.innerHTML=`<svg viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="10"/><circle class="fg" cx="14" cy="14" r="10"/></svg>`;
    ring.style.left=ev.clientX+"px";ring.style.top=ev.clientY+"px";document.body.append(ring);
    cur={a,el,ring,t:setTimeout(()=>{el.classList.add("pin");ring.remove();cur=null},HOLD)};
  }
  document.addEventListener("pointerover",ev=>{
    if(ev.pointerType!=="mouse")return;
    const a=ev.target.closest?.(".lk[data-ent]");if(!a||cur?.a===a)return;
    stop();start(a,ev);
  });
  document.addEventListener("pointerout",ev=>{if(cur&&!cur.a.contains(ev.relatedTarget))stop()});
  document.addEventListener("pointermove",ev=>{if(cur?.ring){cur.ring.style.left=ev.clientX+"px";cur.ring.style.top=ev.clientY+"px"}});
  document.addEventListener("pointerdown",ev=>{if(cur&&cur.a.contains(ev.target))stop()}); // al hacer clic manda el clic
  // Fijas: arrastrar por la cabecera, traer al frente, cerrar con ✕ o Esc
  root.addEventListener("pointerdown",ev=>{
    const el=ev.target.closest(".peek.pin");if(!el)return;root.append(el);
    if(ev.target.closest("[data-pclose]")){el.remove();return}
    const hd=ev.target.closest(".whead");if(!hd)return;
    const r=el.getBoundingClientRect(),dx=ev.clientX-r.left,dy=ev.clientY-r.top;hd.setPointerCapture(ev.pointerId);
    const mv=e=>{el.style.left=Math.min(Math.max(0,e.clientX-dx),innerWidth-60)+"px";el.style.top=Math.min(Math.max(0,e.clientY-dy),innerHeight-40)+"px"};
    const up=()=>{hd.removeEventListener("pointermove",mv);hd.removeEventListener("pointerup",up)};
    hd.addEventListener("pointermove",mv);hd.addEventListener("pointerup",up);
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){const p=root.querySelector(".peek.pin:last-child");if(p)p.remove()}});
  return {stop,clear(){stop();root.innerHTML=""}};
})();
