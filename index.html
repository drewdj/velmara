<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velmara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Overpass:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Estilo del manual de Daggerheart: páginas violeta profundo, filetes dorados con esquinas
   angulares, etiquetas doradas y cartas blancas. Interstate Condensed → Barlow Condensed; cuerpo en Overpass. */
:root{
  --night:#1B1230; --violet:#281C45; --violet-2:#33255A; --lilac:#F5EEF2; --paper:#FDFCF7;
  --gold:#F9A72B; --gold-hi:#FAC472; --gold-lo:#E08A1E; --ink:#231F20; --muted:#B9AECF; --line:#4A3B73;
  --ok:#8FD19E; --bad:#FF8A70;
  --cond:"Barlow Condensed","Interstate Condensed","Arial Narrow",sans-serif;
  --body:"Overpass","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3A2A66 0%,var(--night) 60%) fixed,var(--night);color:var(--paper);
  font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--cond);font-weight:700;margin:0;text-wrap:balance;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* Marco con esquinas doradas, como los recuadros del manual */
.deco{position:relative;background:var(--violet);border:1px solid var(--line);padding:22px 24px}
.deco::before,.deco::after{content:"";position:absolute;width:38px;height:38px;border:2px solid var(--gold);pointer-events:none}
.deco::before{top:6px;left:6px;border-right:0;border-bottom:0;clip-path:polygon(0 0,100% 0,100% 2px,10px 2px,2px 10px,2px 100%,0 100%)}
.deco::after{bottom:6px;right:6px;border-left:0;border-top:0;clip-path:polygon(100% 100%,0 100%,0 calc(100% - 2px),calc(100% - 10px) calc(100% - 2px),calc(100% - 2px) calc(100% - 10px),calc(100% - 2px) 0,100% 0)}
.tab-label{display:inline-block;justify-self:start;width:max-content;max-width:100%;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));padding:3px 14px 2px;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.black-label{display:inline-block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:2px 10px}

/* Cabecera */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px}
.brand span{font-family:var(--cond);font-weight:700;font-size:1.7rem;letter-spacing:.18em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who .nm{font-family:var(--cond);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.linkbtn{background:none;border:0;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:.9rem}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px rgb(143 209 158 / .25)}
.coins{display:inline-flex;gap:4px;align-items:center}
.coin{width:15px;height:15px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));box-shadow:inset 0 0 0 2px rgb(40 28 69 / .35)}
.coin.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.coins .n{margin-left:6px;font-size:.85rem;color:var(--muted)}

nav.main{display:flex;gap:6px;flex-wrap:wrap;padding-block:16px}
nav.main button{font-family:var(--cond);font-weight:600;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid transparent;padding:6px 16px;color:var(--muted)}
nav.main button[aria-current="true"]{color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--cond);font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--gold-hi);text-transform:uppercase;letter-spacing:.05em}
.crumbs i{font-style:normal;opacity:.6}

/* Elegir personaje */
.pick{padding-block:6vh 24px;display:grid;gap:26px}
.pick header h1{font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:.14em;text-transform:uppercase}
.pick header p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.pjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.pjcard{display:grid;gap:6px;text-align:left;padding:22px 20px 20px;background:var(--violet);border:1px solid var(--line);position:relative;min-height:170px;align-content:end}
.pjcard:hover,.pjcard:focus-visible{border-color:var(--gold)}
.pjcard .init{position:absolute;top:10px;right:16px;font-family:var(--cond);font-weight:700;font-size:4rem;line-height:1;color:var(--violet-2)}
.pjcard .nm{position:relative;font-family:var(--cond);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.04em}
.pjcard .cl{position:relative;color:var(--muted);font-size:.92rem}

/* Lugares */
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.place{display:grid;gap:10px;text-align:left;width:100%;color:inherit}
button.place:hover{border-color:var(--gold)}
.place h2{font-size:2rem;text-transform:uppercase;letter-spacing:.04em}
.place p{margin:0;color:var(--muted)}
.place.locked{background:transparent;border-style:dashed;color:var(--muted)}
.place.locked::before,.place.locked::after{border-color:var(--line)}
.notice{border-left:3px solid var(--gold);background:rgb(249 167 43 / .08);padding:8px 12px;color:var(--paper);font-size:.95rem}
.notice b{font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-hi);margin-right:6px}
.hero{display:grid;gap:10px;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);text-transform:uppercase;letter-spacing:.06em}
.hero .sub{font-family:var(--cond);font-size:1.15rem;color:var(--gold-hi);letter-spacing:.06em;text-transform:uppercase}
.hero p{margin:0;max-width:66ch;color:var(--lilac)}
.hero .quote{font-style:italic;color:var(--muted)}
.shops{display:grid;gap:12px}
.shop{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.shop .l{min-width:0;flex:1 1 260px;display:grid;gap:4px}
.shop h3{font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.state{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;padding:2px 10px;border:1px solid}
.state.open{color:var(--ok);border-color:var(--ok)}
.state.shut{color:var(--muted);border-color:var(--line)}

/* Botones */
.btn{font-family:var(--cond);font-weight:700;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;border:0;padding:7px 16px 6px;
  color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:inset 0 0 0 1.5px var(--gold);clip-path:none}
.btn.warn{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad);clip-path:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Subpestañas de la tienda */
.subtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:18px}
.subtabs button{font-family:var(--cond);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;background:var(--gold);color:var(--violet);font-size:.8rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
section.block{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:34px}
section.block>header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
section.block>header p{margin:0;color:var(--muted);font-size:.95rem}
.note{margin:0;font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}

/* Cartas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:22px 18px}
.slotcard{container-type:inline-size;display:grid;gap:8px;align-content:start;min-width:0}
.dh-card{container-type:inline-size;position:relative;width:100%;min-height:140cqw;background:#fff;color:var(--ink);border-radius:10px;
  box-shadow:0 0 0 1px rgb(249 167 43 / .55),0 10px 28px rgb(0 0 0 / .4);display:flex;flex-direction:column}
.dh-card.gone{filter:grayscale(1);opacity:.55}
.dh-card.mine{box-shadow:0 0 0 3px var(--gold),0 10px 28px rgb(0 0 0 / .4)}
.cframe{display:block;width:100%;height:auto;flex:none}
.cframe text{font-family:var(--cond)}
.c-banner{font-weight:700;font-size:31px;letter-spacing:2px;fill:var(--violet)}
.m-big{font-weight:700;font-size:46px;fill:var(--violet)}
.m-small{font-style:italic;font-weight:500;font-size:27px;fill:var(--violet)}
.cbody{flex:1;padding:0 5cqw 13cqw;margin-top:-1cqw;display:grid;align-content:start;gap:1.2cqw;font-size:4.6cqw;line-height:1.3}
.cbody h4{font-size:8.2cqw;text-align:center;color:var(--ink);letter-spacing:.01em}
.cbody .ctype{text-align:center;font-family:var(--cond);font-style:italic;font-weight:600;font-size:5.2cqw;margin-bottom:1.5cqw}
.cbody .ctrait{font-family:var(--cond);font-weight:700;font-size:6cqw}
.cbody p{margin:0}
.cbody b{font-family:var(--cond);font-weight:700;font-size:1.08em}
.hands{position:absolute;right:4cqw;bottom:3cqw;display:flex;gap:1.5cqw}
.hands svg{width:8.5cqw;height:auto;fill:#fff;stroke:#9a97a3;stroke-width:1.6}
.slots{position:absolute;right:4cqw;bottom:3.5cqw;display:grid;grid-template-columns:repeat(3,auto);gap:1.2cqw}
.slots svg{width:6cqw;height:auto;fill:#fff;stroke:#8e8b97;stroke-width:1.4}
.under{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.holder{font-size:.9rem;color:var(--muted)}
.holder b{color:var(--paper)}
.stock.zero{color:var(--bad)}

/* Botes, inventario, libro */
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.pot{display:grid;gap:10px}
.pot h3{font-size:1.4rem;text-transform:uppercase}
.bar{height:12px;background:var(--night);display:flex;border:1px solid var(--line)}
.bar span{background:linear-gradient(100deg,var(--gold-hi),var(--gold))}
.bar span+span{box-shadow:inset 2px 0 0 var(--night)}
.contrib{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;color:var(--muted)}
.contrib b{color:var(--paper)}
.rows{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--violet);border-left:3px solid var(--gold)}
.row .l{min-width:0;flex:1 1 240px}
.row .l b{font-family:var(--cond);font-size:1.15rem;letter-spacing:.02em}
.row .l small{display:block;color:var(--muted);font-size:.88rem}
select,input[type=text],input[type=search],input[type=number],input:not([type]),textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:5px 8px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--violet)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
tr:last-child td{border-bottom:0}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.93rem}
.log li{display:flex;gap:12px}
.log time{color:var(--muted);flex:none;width:44px}
.invtop{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.invtop h1{font-size:clamp(2rem,6vw,3rem);text-transform:uppercase;letter-spacing:.06em}
.ph{min-height:180px;display:grid;place-content:center;text-align:center;gap:6px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);padding:16px}
.ph b{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--paper)}
.dmgrid{display:grid;gap:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.picker{display:grid;gap:10px;margin-bottom:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,520px);
  background:var(--paper);color:var(--violet);padding:10px 18px;font-weight:600;box-shadow:0 8px 28px rgb(0 0 0 / .45)}
.toast.err{background:var(--bad);color:var(--ink)}


/* Encuentros (DM) */
.encgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.encgrid{grid-template-columns:1fr}}
.encpanel{position:sticky;top:12px}@media (max-width:900px){.encpanel{position:static}}
.encbest input[type=search]{width:100%;margin:6px 0 8px}
.advlist{display:grid;gap:6px;margin-top:10px}
.advrow{background:var(--violet);border-left:3px solid var(--line)}.advrow.on{border-left-color:var(--gold)}
.advh{display:flex;align-items:center;gap:10px;padding:6px 8px}
.advn{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 0;display:grid}
.advn b{font-family:var(--cond);font-size:1.08rem;letter-spacing:.02em}.advn small,.advq{color:var(--muted);font-size:.85rem}
.addadv{padding:4px 12px;min-width:44px}
.advf{padding:4px 12px 12px;display:grid;gap:6px;font-size:.93rem}.advd{font-style:italic;color:var(--muted);margin:0}.advf p{margin:0}
.advst{display:flex;flex-wrap:wrap;gap:6px 16px}.advst span{display:grid}.advst small{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.advk{font-family:var(--cond);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:0 6px;border:1px solid var(--line);color:var(--gold)}
.encbud{margin:10px 0}.encbar{height:12px;background:var(--night);border:1px solid var(--line)}.encbar span{display:block;height:100%;background:var(--gold)}
.encbud.ok .encbar span{background:#5FC98A}.encbud.over .encbar span{background:var(--bad)}.encbud p{margin:6px 0 0}
.encaj{margin:4px 0 10px}.encaj summary{cursor:pointer;color:var(--muted)}.encaj .toggle{display:flex;margin:6px 0;text-transform:none;letter-spacing:0;font-weight:500}
.encits,.enclist{display:grid;gap:6px;margin:8px 0}
.encit,.encsv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 10px;background:var(--violet)}
.encit>div,.encsv>div{flex:1;min-width:140px;display:grid}.encit small,.encsv small{color:var(--muted);font-size:.82rem}.encpts{color:var(--gold);min-width:44px;text-align:right}
.encboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin:12px 0}
.encboard{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.encc{position:relative;display:grid;gap:7px;align-content:start;padding:0 10px 10px;background:#FBF7EE;color:var(--ink);border-radius:10px;box-shadow:0 0 0 2px var(--ty),0 8px 22px rgb(0 0 0 / .35)}
.encc.out{filter:grayscale(1);opacity:.5}
.ench{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin:0 -10px;padding:7px 10px;background:var(--ty);color:#fff;border-radius:10px 10px 0 0}
.ench .tipw{display:grid}.ench b{font-family:var(--cond);font-size:1.08rem;line-height:1.1}.ench small{opacity:.85;font-size:.78rem}
.encx{background:none;border:0;color:#fff;cursor:pointer;font-size:.9rem;opacity:.7;padding:2px 4px}.encx:hover{opacity:1}
.encq{display:flex;gap:12px;font-size:.85rem;color:#5d5868}.encq b{color:var(--ink)}
.eatk{display:flex;align-items:baseline;gap:8px;padding:4px 8px;background:#efe7d6;border-left:3px solid var(--ty);font-size:.92rem}.eatk b{font-family:var(--cond);font-size:1.05rem}.eatk small{color:#5d5868;margin-left:auto}
.encc .lab{color:#5d5868;min-width:22px}.encc .trk{display:flex;align-items:center;gap:6px}
.encboard{align-items:start}
.tks{display:flex;flex-wrap:wrap;gap:3px}
.tk{width:18px;height:18px;padding:0;border:2px solid #E0605A;background:#fff;cursor:pointer;border-radius:2px}
.tk.hp.on{background:#E0605A}.tk.st{border-color:#5B8FD0}.tk.st.on{background:#5B8FD0}
.mins{display:flex;flex-wrap:wrap;gap:4px}.minb{width:28px;height:28px;padding:0;border:1px solid #cfc6b4;background:#efe7d6;color:var(--ink);cursor:pointer;border-radius:50%}.minb.off{color:var(--bad);opacity:.6}
.encc .minb{background:#efe7d6;color:var(--ink);border-color:#cfc6b4}
.abils{display:grid;gap:4px}
.abil{display:block;font-size:.8rem;line-height:1.3;padding:3px 7px;border-left:3px solid #cfc6b4;background:#fff;border-radius:0 4px 4px 0;cursor:help}
.abil b{font-family:var(--cond);font-size:.86rem}.abil i{font-style:normal;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:#7a7484;margin-left:6px}.abil span{display:block;color:#3a3542}
.abil.kA{border-left-color:var(--ty)}.abil.kA b{color:var(--ty)}.abil.kR{border-left-style:dotted;border-left-color:var(--ty)}
.advres{font-weight:600}.advft small{color:var(--muted)}
.tipw{position:relative;outline-offset:2px}
.tipw:hover::after,.tipw:focus::after{content:attr(data-tip);position:absolute;z-index:30;left:0;top:calc(100% + 6px);width:min(270px,78vw);padding:8px 10px;background:var(--ink);color:var(--paper);font:400 .85rem/1.35 var(--body,inherit);text-transform:none;letter-spacing:0;border:1px solid var(--gold);box-shadow:0 8px 22px rgb(0 0 0 / .45);white-space:normal;pointer-events:none}
.cnds{display:flex;flex-wrap:wrap;gap:4px}
.cnd{font:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border:1px solid #cfc6b4;background:none;color:#7a7484;cursor:pointer;border-radius:3px}
.cnd[aria-pressed="true"]{background:var(--ty);border-color:var(--ty);color:#fff}
.encadd select{max-width:100%}
/* Cartas: texto sobre papel, recortado hasta que se toca */
.dh-card{background:#FBF7EE;cursor:pointer}
.cbody{background:#FBF7EE;border-radius:0 0 10px 10px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.dh-card.feat .ft2{font-family:var(--cond);font-style:italic;color:var(--dom);white-space:nowrap}

.feats{min-width:0}
@media (max-width:760px){.featcards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding:4px 2px 12px;max-width:100%}
 .featcards .slotcard{flex:0 0 min(78vw,300px);scroll-snap-align:center}}
.d-dn{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:2px;fill:#fff}
.d-rc{font-family:var(--cond);font-weight:700;font-size:44px;fill:var(--violet)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px}
.minislot{display:grid;gap:6px;align-content:start;min-width:0}
.mini{position:relative;background:#FBF7EE;color:var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgb(249 167 43 / .55),0 6px 18px rgb(0 0 0 / .35);cursor:pointer}
.mart{display:block;width:100%;height:auto;border-bottom:4px solid var(--gold)}
.qty{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--violet);font-family:var(--cond);font-weight:700;padding:1px 8px}

.mbody h4{font-size:1.15rem}
.mtype{font-family:var(--cond);font-style:italic;font-weight:600;color:#5A4E78}
.mbody p{margin:4px 0 0}
.minislot .btns .btn{font-size:.9rem;padding:5px 10px}
.minislot select{font-size:.85rem;padding:3px 6px}

/* Hoja de personaje */
.sheet{display:grid;gap:18px}
.idrow{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.idrow h1{font-size:clamp(2.2rem,7vw,3.4rem);text-transform:uppercase;letter-spacing:.06em}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px 16px}
.field{display:grid;gap:3px}
.field label,.lab{font-family:var(--cond);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-hi)}
.field input{width:100%}
.traits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:760px){.traits{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:400px){.traits{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trait{display:grid;justify-items:center;gap:6px;background:var(--lilac);color:var(--ink);padding:0 6px 10px;text-align:center}
.trait .black-label{width:calc(100% + 12px);font-size:.95rem}
.trait .val{font-family:var(--cond);font-weight:700;font-size:2.2rem;line-height:1}
.trait small{font-size:.75rem;color:#5A4E78;line-height:1.2}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:28px;height:28px;border:1px solid var(--line);background:var(--violet-2);color:var(--paper);font-weight:700;line-height:1;padding:0}
.trait .step button{background:#fff;color:var(--violet);border-color:#CFC3DB}
.step .v{min-width:2.2ch;text-align:center;font-family:var(--cond);font-weight:700;font-size:1.3rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.stat{display:grid;gap:8px}
.stat .big{font-family:var(--cond);font-weight:700;font-size:2.4rem;line-height:1}
.track{display:flex;flex-wrap:wrap;gap:5px}
.track button{width:26px;height:26px;padding:0;border:2px solid var(--gold);background:transparent}
.track button.on{background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo))}
.track.hope button{transform:rotate(45deg);width:22px;height:22px;margin:3px}
.track.stress button{border-color:#C8A2FF}.track.stress button.on{background:#9A6BE0}
.thresh{display:flex;align-items:stretch;flex-wrap:wrap;font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:.9rem;letter-spacing:.04em}
.thresh span{padding:6px 10px;background:var(--lilac);color:var(--ink);border-right:1px solid #CFC3DB}
.thresh b{display:block;font-size:1.5rem;line-height:1}
.thresh span.n{background:var(--ink);color:var(--paper);display:grid;place-content:center;font-size:1.3rem}
.exps{display:grid;gap:8px}
.exp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exp input{flex:1 1 200px}
@media (prefers-reduced-motion:no-preference){.pjcard,.place,.btn{transition:border-color .15s,filter .15s,opacity .15s}}


/* ---------- DM, modos y Mundo ---------- */
.dmtag{font-family:var(--cond);font-weight:700;letter-spacing:.12em;background:linear-gradient(100deg,var(--gold-hi),var(--gold-lo));color:var(--violet);padding:2px 10px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#dm-pj{font-size:.9rem;padding:3px 6px}
nav.main .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 3px rgb(143 209 158 / .25)}
.seg{display:inline-flex;border:1px solid var(--gold);align-self:end}
.seg button{background:none;border:0;padding:6px 18px;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-hi)}
.seg button[aria-selected="true"]{background:linear-gradient(100deg,var(--gold-hi),var(--gold-lo));color:var(--violet)}
.dmcard{border-style:dashed;padding:0}
.dmopen{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;align-content:end;padding:22px 20px 20px;min-height:170px;position:relative;width:100%}

.dmform{display:grid;gap:8px;padding:18px 20px}
.dmform input{width:100%;box-sizing:border-box;font:inherit;padding:6px 8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.err{margin:0;color:var(--bad);font-size:.9rem}
.now{margin-bottom:18px}
.nowcard{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 28px rgb(249 167 43 / .18)}
.nowcard>div{display:grid;gap:4px;flex:1 1 240px;min-width:0}
.nowcard h2{font-size:1.8rem;text-transform:uppercase;letter-spacing:.04em}
.avisos{display:grid;gap:8px;margin-bottom:18px}
.lore{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.loreitem{display:grid;gap:8px;align-content:start;text-align:left;color:inherit;width:100%;padding:18px 20px}
.loreitem .black-label{justify-self:start;font-size:.8rem}
.loreitem h3{font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em}
.loreitem p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.4}
.loreitem:hover,.loreitem:focus-visible{border-color:var(--gold)}
.sees{font-family:var(--cond);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sees.on{color:var(--ok)}
.prose{max-width:72ch;line-height:1.6}
.prose h2,.prose h3,.prose h4{text-transform:uppercase;letter-spacing:.05em;color:var(--gold-hi);margin:22px 0 8px}
.prose h2{font-size:1.6rem}.prose h3{font-size:1.3rem}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin-bottom:4px}
.prose b{color:var(--paper)}
.prose blockquote{margin:0 0 12px;border-left:3px solid var(--line);padding-left:12px;color:var(--lilac)}
.callout{border:1px solid var(--line);background:var(--violet-2);padding:10px 14px;margin:0 0 12px}
.callout>b{display:block;font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:6px}
.callout.secret{border-color:var(--bad);background:rgb(255 138 112 / .08)}
.callout.secret>b{color:var(--bad)}
.lk{all:unset;cursor:pointer;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px}
.lk.off{cursor:default;text-decoration:none;color:inherit}
.dmlore{display:grid;gap:22px}
.share{display:grid;gap:10px}
.share .chips{margin:0}
.shtxt{min-height:180px;font-size:.92rem;line-height:1.45}
/* ---------- Hoja: vista ---------- */
.stats{display:grid;gap:12px}
.defs{display:flex;flex-wrap:wrap;gap:10px}
.def{display:grid;gap:4px;align-content:start;background:var(--violet);border:1px solid var(--line);padding:10px 16px;min-width:110px}
.def b{font-family:var(--cond);font-size:2.2rem;line-height:1}
.def.wide{flex:1 1 300px}
.res{display:grid;gap:14px}
.rrow{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.rl{display:grid}.rl b{font-family:var(--cond);font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em}.rl span{color:var(--muted);font-size:.9rem}
.rrow .track button{width:30px;height:30px}
.rrow .track.hope button{width:24px;height:24px;margin:3px}
.track.armor button{border-color:#8FB6E8}.track.armor button.on{background:#8FB6E8}
.rbtn{display:inline-flex;gap:6px}
.rbtn button{width:40px;height:40px;font-size:1.4rem;font-weight:700;border:1px solid var(--gold);background:var(--night);color:var(--gold-hi);padding:0}
.rbtn button:disabled{opacity:.35}
@media (max-width:600px){.rrow{grid-template-columns:minmax(0,1fr) auto}.rrow .track{grid-column:1/-1;grid-row:2}}
.xps{display:flex;flex-wrap:wrap;gap:8px}
.xp{background:var(--lilac);color:var(--ink);padding:4px 12px;font-weight:600}
.xp b{color:var(--violet)}
.pre{white-space:pre-wrap;margin:0}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clist{display:grid;gap:6px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border-bottom:1px solid var(--line);padding:6px 0}
.crow small{color:var(--muted);flex:1 1 120px}
.cdot{width:12px;height:12px;border-radius:50%;flex:none}
/* ---------- Inventario ---------- */
.invhelp{margin:-6px 0 14px}
.invgrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.invgrid{grid-template-columns:minmax(0,1fr)}}
.eslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.eslot{display:grid;gap:6px;align-content:start;padding:8px;border:1px solid var(--line);background:var(--night);min-width:0}
.elab{font-family:var(--cond);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-hi);text-align:center;line-height:1.1;min-height:2.2em;display:grid;place-content:center}
.eslot.can,.tiles.can{outline:2px dashed var(--gold);outline-offset:2px;background:rgb(249 167 43 / .08);cursor:pointer}
.eslot.over,.tiles.over{outline-style:solid;background:rgb(249 167 43 / .18)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:8px;border:1px solid var(--line);background:var(--night);min-height:120px;align-content:start}
.tile{position:relative;display:grid;gap:0;padding:0;border:1px solid rgb(249 167 43 / .5);background:#140D24;color:var(--paper);text-align:center;overflow:hidden;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile[data-drag]{cursor:grab}
.tile .tart{display:block;width:100%;height:auto;aspect-ratio:1;pointer-events:none}
.tile .tn{font-family:var(--cond);font-weight:700;font-size:.85rem;line-height:1.1;padding:5px 4px 6px;background:var(--violet);min-height:2.2em;display:grid;place-content:center;overflow-wrap:anywhere}
.tile .qty{position:absolute;top:4px;right:4px;background:var(--ink);color:var(--paper);font-size:.8rem;padding:0 6px}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 16px rgb(249 167 43 / .5)}
.tile.empty{aspect-ratio:1/1.25;border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted)}
.tile.empty .tn{background:none;font-weight:600}
.tile.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:.9;box-shadow:0 10px 30px rgb(0 0 0 / .5)}
.invdet{margin-top:18px;display:grid;gap:10px;max-width:320px}
.detcard{container-type:inline-size}
.pcard{display:grid;gap:8px}
.pcard h3{font-size:1.5rem;text-transform:uppercase}
.irow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border-bottom:1px solid var(--line);padding:8px 0}
.irow small{color:var(--muted);flex:1 1 160px}
.irow select{font-size:.85rem;padding:3px 6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:6px 8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.prow textarea{grid-column:1/-1;min-height:48px}
@media (max-width:600px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow input[type=text]{grid-column:1/-1}}
.padd{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.padd input{flex:1 1 220px}


/* ---------- Mano y baúl: arrastrar cartas ---------- */
.handgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:20px;align-items:start}
@media (max-width:820px){.handgrid{grid-template-columns:minmax(0,1fr)}}
.cdrop{min-height:150px;padding:6px;outline-offset:4px}
.cdrop.small{border:1px dashed var(--line)}
.cdrop.small{grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:12px}
@media (max-width:820px){.cdrop.small{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
.cdrop.can{outline:2px dashed var(--gold);background:rgb(249 167 43 / .06)}
.cdrop.over{outline-style:solid;background:rgb(249 167 43 / .16)}
[data-cdrag]{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
[data-cdrag].lifted{opacity:.35}
.slotcard.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 14px 34px rgb(0 0 0 / .55);cursor:grabbing}
/* Mapas: arrastrar y pellizcar no selecciona texto ni abre el menú de copiar */
#msvg,#wsvg,#msvg *,#wsvg *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* ---------- Compendio ---------- */
.cbar{display:grid;gap:8px;padding:10px 0;background:var(--night);border-bottom:1px solid var(--line);margin-bottom:8px}
.cbar .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}.cbar input[type=search]{flex:1;min-width:0}
@media (min-width:821px){.cbar{position:sticky;top:0;z-index:6}.cpick{scroll-margin-top:240px}}
/* Sesiones: libro de la crónica */
.libro{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start;margin-top:18px}
.lidx{display:grid;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}
.lidx .btns .btn{font-size:.9rem;padding:5px 12px}
.lits{display:grid;gap:6px}
.lit{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--violet);border:1px solid var(--line);border-left:3px solid var(--line)}
.lit:hover{border-color:var(--gold-lo)}.lit:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lit[aria-current="true"]{border-color:var(--gold);border-left-color:var(--gold);background:var(--violet-2)}
.lnum{font-family:var(--cond);font-weight:700;font-size:1.5rem;line-height:1;color:var(--gold-hi);min-width:1.6ch;text-align:center}
.ltx{display:grid;min-width:0}.ltx b{font-family:var(--cond);font-size:1.05rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltx small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnow{font-style:normal;color:var(--gold);font-size:.8rem}.lnow.off{color:var(--muted)}
.lcol{display:grid;gap:18px;min-width:0}
.lpage{display:grid;gap:18px;padding:26px clamp(16px,4vw,44px) 22px}
.lhead{display:grid;gap:8px}.lhead h1,.lptit{margin:0;font-family:var(--cond);font-size:clamp(2rem,5vw,2.8rem);line-height:1.05;text-transform:uppercase;letter-spacing:.03em;color:var(--paper)}
.ltags{display:flex;flex-wrap:wrap;gap:8px}.ltags:empty{display:none}
.lhid{font-family:var(--cond);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--muted);padding:0 8px}
.ldm .btn{font-size:.9rem;padding:5px 12px}
.ltldr{border-left:3px solid var(--gold);background:rgb(249 167 43 / .08);padding:10px 16px 6px}
.ltldr h3{margin:0 0 6px;font-family:var(--cond);font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-hi)}
.ltldr ul{margin:0;padding-left:20px;display:grid;gap:4px}.ltldr li{line-height:1.45}
.lbody{max-width:68ch;font-size:1.05rem;line-height:1.7}
.lbody>p:first-child::first-letter{float:left;font-family:var(--cond);font-weight:700;font-size:3.4em;line-height:.85;padding:4px 8px 0 0;color:var(--gold)}
.lfig{margin:6px 0 20px;display:grid;gap:6px}.lfig img{width:100%;max-height:70vh;object-fit:contain;background:#140D24;border:1px solid var(--line);display:block}
.lfig figcaption{font-size:.85rem;color:var(--muted);font-style:italic}
.lsep{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0}
.lpn{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.lpnb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;padding:6px 0;min-width:0}.lpnb:last-child{text-align:right}
.lpnb small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.lpnb b{color:var(--gold-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpnb:hover b{text-decoration:underline}.lpnb:focus-visible{outline:2px solid var(--gold)}
.lnotas{display:grid;gap:8px}.lnotas h3{margin:0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--gold-hi)}
.lnotas textarea{width:100%;box-sizing:border-box;min-height:140px;line-height:1.5}
.lnota{border-left:3px solid var(--line);padding-left:10px}.lnota p{margin:2px 0 0;white-space:pre-wrap}
.ledit{display:grid;gap:12px}.ledit h2{margin:0}.ledit label{display:grid;gap:4px;font-family:var(--cond);letter-spacing:.04em}
.ledit textarea{width:100%;box-sizing:border-box;font-family:var(--body);line-height:1.5}.ltxt{min-height:320px}
.lrow{display:flex;flex-wrap:wrap;gap:10px}.lrow label{flex:0 0 110px}.lrow .grow{flex:1 1 200px}.lrow input{width:100%;box-sizing:border-box}
.lfile{cursor:pointer}
.lempty{margin-top:0}
@media (max-width:820px){.libro{grid-template-columns:minmax(0,1fr)}
  .lidx{position:static;max-height:none;overflow:visible}
  .lits{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x proximity}
  .lit{flex:0 0 auto;max-width:220px;scroll-snap-align:start}}
@media (max-width:820px){.cbar>.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.cbar>.chips .chip{flex:none}}
.cfacs{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.cfac{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.cfac>span{font-family:var(--cond);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}

/* ---------- Avisos ---------- */
.bellw{position:relative}
.trchips{align-items:center;margin-top:8px}.trchips .lab{margin-right:4px}

/* ---------- Contactos ---------- */
.cthead{margin:6px 0 14px}.cthead h1{margin:2px 0 0}

.ctdm{margin-top:14px}
.ctadd{margin-top:20px}.ctrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ctrow select{flex:1;min-width:0}
/* ---------- Vista previa de enlaces (pasar el ratón; 1,5 s la fija) ---------- */
#peeks{position:fixed;inset:0;z-index:70;pointer-events:none}
.peek{position:fixed;width:min(360px,calc(100vw - 24px));max-height:min(60vh,520px);display:flex;flex-direction:column;background:var(--violet);border:1px solid var(--gold);box-shadow:0 14px 40px rgb(0 0 0 / .55);pointer-events:none;animation:peekin .12s ease-out}

.mlab{font-family:var(--cond);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.mrow{display:grid;gap:6px}

.mptitle{color:var(--gold-hi)}.mpnote{margin:0;white-space:pre-wrap}

.mtrack{position:relative;height:42px;margin:0 6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline-offset:6px}

.mtline,.mtfill{position:absolute;left:0;top:13px;height:4px;background:var(--line);border-radius:2px;width:100%}

.eslot .elab{grid-column:2;justify-self:start;font-family:var(--cond);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-self:end}
.eslot>.tile{grid-row:1/3;grid-column:1}
.eslot .tile .tn{display:none}
.eslot .einfo{grid-column:2;display:grid;gap:2px;align-self:start;min-width:0}
.eslot .einfo b{font-family:var(--cond);font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.eslot .einfo small{color:var(--gold-hi);font-size:.85rem}
.eslot.full{border-color:rgb(249 167 43 / .45)}
.tile.empty{aspect-ratio:1;display:grid;place-content:center;gap:2px}
.tile.empty .kic.big{position:static;font-size:1.8rem;opacity:.4;background:none;width:auto;height:auto}
.cstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.cstats>div{display:grid;gap:2px;justify-items:center;background:var(--night);border:1px solid var(--line);padding:8px 4px;text-align:center}
.cstats .lab{font-size:.7rem}
.cstats b{font-family:var(--cond);font-size:1.6rem;line-height:1}
.cstats b small{font-size:1rem;opacity:.6;margin:0 1px}
.pips{display:flex;gap:4px;padding-top:6px}
.pips i{width:12px;height:12px;transform:rotate(45deg);box-shadow:inset 0 0 0 1.5px var(--gold)}
.pips i.on{background:var(--gold)}
.bag{background:var(--violet);border:1px solid var(--line);padding:16px}
.baghead{display:flex;justify-content:space-between;align-items:center}
.ifil{display:flex;gap:4px;flex-wrap:wrap}
.ifil button{font-family:var(--cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.9rem;background:var(--night);border:1px solid var(--line);color:var(--muted);padding:4px 10px}
.ifil button small{opacity:.7;margin-left:2px}
.ifil button[aria-selected="true"]{color:var(--violet);background:linear-gradient(100deg,var(--gold-hi),var(--gold-lo));border-color:var(--gold)}
.tiles{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));background:rgb(10 6 20 / .55);border-color:var(--line);
  background-image:linear-gradient(rgb(74 59 115 / .25) 1px,transparent 1px),linear-gradient(90deg,rgb(74 59 115 / .25) 1px,transparent 1px);background-size:24px 24px}
.tile{--rc:#9A8FB5;border:2px solid var(--rc);border-radius:6px;box-shadow:inset 0 0 18px -6px var(--rc)}
.tile.r-c{--rc:#8FD19E}.tile.r-pc{--rc:#6BB3FF}.tile.r-r{--rc:#E06CFF}.tile.r-rec{--rc:#F5C35A}
.tile.r-t1{--rc:#B9AECF}.tile.r-t2{--rc:#6BB3FF}.tile.r-t3{--rc:#E06CFF}.tile.r-t4{--rc:#F9A72B}.tile.r-p{--rc:#C9B58F}
.tile:not(.empty):hover{transform:translateY(-2px);box-shadow:inset 0 0 18px -6px var(--rc),0 6px 16px -4px var(--rc)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgb(249 167 43 / .6)}
.tile .kic{position:absolute;top:4px;left:4px;width:20px;height:20px;display:grid;place-items:center;font-size:.75rem;background:rgb(10 6 20 / .7);color:var(--rc);border-radius:3px}
.tile .qty{background:var(--gold);color:var(--violet);font-weight:700;border-radius:3px}
.tile .tn{background:rgb(10 6 20 / .85)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .12s,box-shadow .12s}}
.invdet{margin:0;max-width:none;position:sticky;top:12px;background:var(--violet);border:1px solid var(--gold);padding:14px;display:grid;gap:10px}
.dmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rtag{font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;padding:1px 8px;border:1px solid var(--rc,#9A8FB5);color:var(--rc,#9A8FB5)}
.rtag.r-c{--rc:#8FD19E}.rtag.r-pc{--rc:#6BB3FF}.rtag.r-r{--rc:#E06CFF}.rtag.r-rec{--rc:#F5C35A}.rtag.r-t1{--rc:#B9AECF}.rtag.r-t2{--rc:#6BB3FF}.rtag.r-t3{--rc:#E06CFF}.rtag.r-t4{--rc:#F9A72B}.rtag.r-p{--rc:#C9B58F}
.cmp{display:grid;gap:4px;background:var(--night);padding:8px 10px;border-left:3px solid var(--gold)}
.cmp .cl{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.cmp .cl small{color:var(--muted);text-align:right}
.cmp b.up{color:var(--ok)}.cmp b.down{color:var(--bad)}
.warnt{color:var(--bad)}
@media (max-width:1100px){.invgrid.withdet{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
 .invdet{position:fixed;left:auto;right:16px;bottom:16px;top:auto;width:min(340px,calc(100vw - 32px));max-height:75vh;overflow:auto;z-index:30;box-shadow:0 18px 50px rgb(0 0 0 / .6)}}
@media (max-width:820px){.invgrid,.invgrid.withdet{grid-template-columns:1fr}
 .invdet{left:0;right:0;bottom:0;width:auto;max-height:70vh;border-width:2px 0 0;padding:14px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom))}
 .invdet .detcard{width:100%;max-width:160px;margin:0 auto;order:2}.invdet .btns{order:-1}.invdet .btns .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="maproot" hidden></div>
<div id="mundoroot" hidden></div>
<div id="peeks"></div>
<div id="notifpop" class="notifpop" role="status" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=61"></script>
<script src="js/datos.js?v=61"></script>
<script src="js/dominios.js?v=61"></script>
<script src="js/reglas.js?v=61"></script>
<script src="js/store.js?v=61"></script>
<script src="js/creacion.js?v=61"></script>
<script src="js/chatarra.js?v=61"></script>
<script src="js/dom-iconos.js?v=61"></script>
<script src="js/cartas.js?v=62"></script>
<script src="js/arte-equipo.js?v=1"></script>
<script src="js/mapa.js?v=61"></script>
<script src="js/contenido.js?v=61"></script>
<script src="js/saber.js?v=61"></script>
<script src="js/mundo.js?v=61"></script>
<script src="js/libro.js?v=61"></script>
<script src="js/recorte.js?v=61"></script>
<script src="js/adversarios.js?v=61"></script>
<script src="js/adv-res.js?v=61"></script>
<script src="js/encuentros.js?v=61"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const TAB=Math.random().toString(36).slice(2);
const ui={cf:{},bell:false,ciq:"",cig:"",dtab:ls.get("v-dtab"),ccol:ls.get("v-ccol"),cid:null,cq:"",cdraft:null,cimg:undefined,cconfirm:false,ct:ls.get("v-ct"),lg:ls.get("v-lg"),me:ls.get("v-pj"),view:ls.get("v-view")||"personaje",ent:ls.get("v-ent"),cat:ls.get("v-cat"),tienda:ls.get("v-tienda"),
  stab:ls.get("v-stab")||"equipo",pick:null,allDoms:false,filt:"todo",wf:"fis",busy:false,canDM:false,confirmReset:false,confirmHide:false,
  edit:{hoja:false,inv:false},sel:null,login:false,loginErr:"",ses:ls.get("v-ses"),ledit:false,ldraft:null,lconfirm:null};
// Los PJs llegan con el Contenido: hasta entonces se guarda a quién eligió este dispositivo
let meEspera=ui.me&&!PJ[ui.me]?ui.me:null;
if(!PJ[ui.me])ui.me=null;
ui.cr=crLoad();
function go(patch){Object.assign(ui,patch);["view","ent","cat","tienda","stab"].forEach(k=>ls.set("v-"+k,ui[k]));ui.confirmReset=false;render();scrollTo({top:0})}

let toastT;
function toast(m,err){const t=$("#toast");t.textContent=m;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}
async function act(fn,ok){
  if(ui.busy)return;ui.busy=true;render();
  try{await Store.mutate(st=>fn(st));if(ok)toast(ok)}
  catch(e){toast(e instanceof Nope?e.message:"No se pudo guardar. Revisa la conexión y prueba otra vez.",true);if(!(e instanceof Nope))console.error(e)}
  finally{ui.busy=false;render()}
}
const coins=(n,max,t)=>{let h="";const m=Math.max(n,max||0);for(let i=0;i<Math.min(m,8);i++)h+=`<span class="coin${i<n?"":" off"}"></span>`;return `<span class="coins">${h}<span class="n num">${t?mon(t,n):`${n} vale${n===1?"":"s"}`}</span></span>`};
// Puntos que ve quien mira la tienda (los suyos o la bolsa común)
const shopCoins=(st,tid)=>{const t=TIENDA[tid];return coins(pts(st,tid,ui.me),+t.inicial||0,t)+(t.modo==="grupo"?`<span class="note">bolsa común</span>`:"")};
const dis=c=>c||ui.busy?"disabled":"";
const MARK=`<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAC472"/><stop offset="1" stop-color="#E08A1E"/></linearGradient></defs><path d="M20 2 L36 11 V29 L20 38 L4 29 V11Z" fill="none" stroke="url(#mg)" stroke-width="2.5"/><path d="M20 9 L28 20 L20 31 L12 20Z" fill="url(#mg)"/></svg>`;

/* ---------- Cabecera y navegación ---------- */
function header(st){
  const me=ui.me&&st?.pjs?.[ui.me];
  const lt={live:"En vivo",local:"Modo prueba",wait:"Conectando…",error:"Sin conexión",offline:"Reconectando…"}[Store.mode];
  const inShop=ui.view==="tiendas"&&ui.tienda&&TIENDA[ui.tienda]&&me; // los puntos solo pintan algo dentro de la tienda
  const who=ui.canDM?`<span class="dmtag">DM</span><select id="dm-pj" aria-label="Ver la hoja de"><option value="">Ver la hoja de…</option>${PJS.map(p=>`<option value="${p.id}" ${p.id===ui.me?"selected":""}>${esc(p.n)}</option>`).join("")}</select>${inShop?shopCoins(st,ui.tienda):""}<button class="linkbtn" data-logout>Salir</button>`
    :ui.me?`<span class="nm">${esc(PJ[ui.me].n)}</span>${inShop?shopCoins(st,ui.tienda):""}<button class="linkbtn" data-switch>Cambiar personaje</button>`:"";
  return `<header class="top"><button class="brand" data-home>${MARK}<span>Velmara</span></button>
   <div class="who">${st&&(ui.me||ui.canDM)?bell(st):""}${who}<span class="live${Store.mode==="live"?" on":""}"><i></i>${lt}</span></div></header>`;
}
const liveShops=()=>TIENDAS.filter(t=>!t.borrado);
/* Avisos: la campana de la cabecera lista lo que está pasando (por ahora, tiendas abiertas).
   Al entrar en la web, o cuando se abre una tienda nueva, sale unos segundos un aviso arriba. */
function notifs(st){const av=ui.canDM?(st.avisos||[]).slice(0,15).map(a=>({id:"av:"+a.t+":"+a.pj,html:`<b>Aviso</b> ${esc(a.x)}`,btn:""})):[];
  const lv=puedeSubir(st,ui.me)?[{id:"lv:"+ui.me+st.mundo.nivel,html:`<b>¡Nivel ${st.hojas[ui.me].nivel+1} disponible!</b> Sube de nivel en tu hoja.`,btn:`<button class="btn" data-view="personaje" data-bellgo>Subir</button>`}]:[];
  return [...av,...lv,...openShops(st).map(t=>({id:"t:"+t.id,html:`<b>${esc(t.n)}</b> está abierta${t.lugar?` en ${esc(lugarN(t.lugar))}`:""}.`,btn:`<button class="btn" data-tienda="${t.id}" data-bellgo>Entrar</button>`}))]}
// Avisos ya leídos (abriendo la campana o viendo el aviso emergente): dejan de contar en la campana
let leidos=new Set();try{leidos=new Set(JSON.parse(ls.get("v-leidos")||"[]"))}catch(e){}
function marcarLeidos(N){let c=false;for(const n of N)if(!leidos.has(n.id)){leidos.add(n.id);c=true}if(c)ls.set("v-leidos",JSON.stringify([...leidos].slice(-200)))}
function bell(st){const N=notifs(st),U=N.filter(n=>!leidos.has(n.id)).length;
  return `<span class="bellw"><button class="bell${U?" on":""}" data-bell aria-label="Avisos${U?`: ${U} sin leer`:""}" aria-expanded="${!!ui.bell}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 15.4A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.6L18 12.6V9a6 6 0 0 0-6-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>${U?`<i class="num">${U}</i>`:""}</button>
   ${ui.bell?`<div class="bellp" role="dialog" aria-label="Avisos"><span class="lab">Avisos</span>${N.map(n=>`<div class="belli"><span>${n.html}</span>${n.btn}</div>`).join("")||`<p class="note">Nada nuevo por ahora.</p>`}</div>`:""}</span>`}
let seenOpen=null;
function popNotifs(st){
  if(!st||!(ui.me||ui.canDM))return;const N=notifs(st),ids=new Set(N.map(n=>n.id));
  const fresh=N.filter(n=>!seenOpen?.has(n.id)&&!leidos.has(n.id));seenOpen=ids;if(!fresh.length)return;
  marcarLeidos(fresh);setTimeout(render,0); // visto el aviso, la campana ya no lo cuenta
  const el=$("#notifpop");el.innerHTML=fresh.map(n=>`<div class="belli"><span>${n.html}</span>${n.btn}</div>`).join("");el.hidden=false;el.classList.remove("out");
  clearTimeout(popNotifs.t);popNotifs.t=setTimeout(()=>{el.classList.add("out");setTimeout(()=>{el.hidden=true},400)},6000);
}
const openShops=st=>liveShops().filter(t=>st.mundo.tiendas[t.id]?.abierta);
const shopsAt=id=>liveShops().filter(t=>t.lugar===id);
// Nombre de un lugar: nota del vault, nota compartida o lugar de la tienda
const lugarN=id=>Saber.dm[id]?.n||Saber.pub[id]?.n||LUGARES.find(l=>l.id===id)?.n||id||"";
function shopRows(st,id){const T=shopsAt(id);if(!T.length)return "";
  return `<div class="wshops">${T.map(t=>{const s=st.mundo.tiendas[t.id]||{};
    return `<div class="wshop"><div><b>${esc(t.n)}</b><span class="note">${esc(t.sub||"")}</span></div><span class="state ${s.abierta?"open":"shut"}">${s.abierta?"Abierta":"Cerrada"}</span>${s.abierta||ui.canDM?`<button class="btn" data-tienda="${t.id}">Entrar</button>`:""}</div>`}).join("")}</div>`}
// Navegación en dos niveles: pocas secciones arriba (abajo en el móvil) y sus subpestañas.
// Cada sección recuerda la última subpestaña abierta.
function grupos(st){const shops=openShops(st).length||ui.view==="tiendas"; // sin tiendas abiertas no hay sección
  return [ui.me&&{k:"pj",n:"Personaje",i:"♟",sub:[["personaje","Hoja"],["inventario","Inventario"],["crafteo","Crafteo"]]},
    {k:"mundo",n:"Mundo",i:"◎",sub:[["mundo","Mapa"],...(ui.me?[["lugares","Lugares"],["contactos","Contactos"],["artefactos","Artefactos"]]:[]),["mapa","Zona Norte"]]},
    {k:"ses",n:"Sesiones",i:"❧",sub:[["sesiones","Sesiones"]]},
    shops&&{k:"tiendas",n:"Tiendas",i:"⚖",sub:[["tiendas","Tiendas"]]},
    ui.canDM&&{k:"dm",n:"Mesa del DM",i:"✦",sub:[["dm","Mesa del DM"]]}].filter(Boolean)}
const grupoDe=(st,v)=>grupos(st).find(g=>g.sub.some(([k])=>k===v));
function nav(st){
  const G=grupos(st),cur=grupoDe(st,ui.view),nOpen=openShops(st).length,lv=puedeSubir(st,ui.me);
  const badge=k=>k==="tiendas"&&nOpen?`<i class="dot" title="Hay tiendas abiertas"></i>`:(k==="pj"||k==="personaje")&&lv?`<i class="dot lv" title="Nivel nuevo disponible">⬆</i>`:"";
  return `<nav class="main" aria-label="Secciones">${G.map(g=>`<button data-grupo="${g.k}" aria-current="${cur?.k===g.k}"><span class="gi" aria-hidden="true">${g.i}</span><span class="gn">${g.n}</span>${badge(g.k)}</button>`).join("")}</nav>
   ${cur&&cur.sub.length>1?`<nav class="subnav" aria-label="${esc(cur.n)}">${cur.sub.map(([k,l])=>`<button data-view="${k}" aria-current="${ui.view===k}">${l}${badge(k)}</button>`).join("")}</nav>`:""}`;
}
const seg=k=>`<div class="seg" role="tablist" aria-label="Modo"><button role="tab" data-mode="${k}" data-v="0" aria-selected="${!ui.edit[k]}">Ver</button><button role="tab" data-mode="${k}" data-v="1" aria-selected="${!!ui.edit[k]}">Editar</button></div>`;

/* ---------- Elegir personaje (o crear uno, o entrar como DM) ---------- */
const pjLinea=(st,p)=>{const h=st?.hojas?.[p.id];return h&&CLASES[h.clase]?`${CLASES[h.clase].n} · ${nombreAsc(h)} · Nivel ${h.nivel}`:p.c||""};
// Retrato redondo: el encuadre (face) si lo hay; la imagen entera (img) es para cartas y fichas
const cara=p=>p?.face||p?.img||"";
const retrato=(p,cls="init")=>cara(p)?`<img class="${cls} pimg" src="${cara(p)}" alt="">`:`<span class="${cls}" aria-hidden="true">${esc((p.n||"?")[0])}</span>`;
function viewPick(st){
  if(ui.crear)return viewCrear(st);
  const L=PJS.filter(p=>!p.prueba);
  return `<div class="pick"><header><span class="tab-label">Antes de entrar</span><h1>¿Quién eres?</h1>
   <p>${L.length?"Elige tu personaje o crea uno nuevo. Se queda guardado en este dispositivo para todo lo que hagas: hoja, inventario y compras.":"Todavía no hay personajes. Crea el tuyo: el creador te lleva paso a paso, como en el manual."}</p></header>
   <div class="pjs">${L.map(p=>`<button class="pjcard deco" data-me="${p.id}">${retrato(p)}
     <span class="nm">${esc(p.n)}</span><span class="cl">${esc(pjLinea(st,p))}<br>Jugador: ${esc(p.j||"")}</span></button>`).join("")}
    <button class="pjcard deco newpj" data-crear ${st?"":"disabled"}><span class="init" aria-hidden="true">+</span><span class="nm">Crear personaje</span><span class="cl">${st?(crLoad()?"Seguir con el que empezaste":"Paso a paso, empieza a nivel 1"):"Cuando el DM prepare la partida"}</span></button>
    <div class="pjcard deco dmcard">${ui.login?`<form id="dmform" class="dmform"><span class="nm">DM</span><label class="note" for="dm-pw">Contraseña</label>
      <input type="password" id="dm-pw" autocomplete="current-password" required><div class="btns"><button class="btn" type="submit" ${dis()}>Entrar</button><button class="btn ghost" type="button" data-login="0">Cancelar</button></div>
      ${ui.loginErr?`<p class="err">${esc(ui.loginErr)}</p>`:""}</form>`
     :`<button class="dmopen" data-login="1"><span class="init" aria-hidden="true">✦</span><span class="nm">Soy el DM</span><span class="cl">Pide contraseña</span></button>`}</div></div></div>`;
}

/* ---------- Crear personaje: los pasos del Core Rulebook ---------- */
const CR_PASOS=[["clase","Clase"],["herencia","Herencia"],["rasgos","Rasgos"],["equipo","Equipo"],["historia","Historia"],["exp","Experiencias"],["cartas","Cartas"],["fin","Nombre"]];
const crNuevo=()=>({paso:0,max:0,clase:"",sub:"",asc1:"",asc2:"",mixta:false,ascN:"",com:"",rasgos:{},pri:"",sec:"",arm:"",pot:"p-men-salud",item:"",preg:{},desc:"",exp:["",""],clankExp:0,cartas:[],conex:{},n:"",j:"",img:"",compN:"",compTipo:"",compAtk:"",compExp:["",""],compImg:""});
function crLoad(){try{return JSON.parse(ls.get("v-crear")||"null")}catch(e){return null}}
function crSave(){ls.set("v-crear",JSON.stringify(ui.cr))}
const crCartasN=d=>d.sub==="conocimiento"?3:2; // la Escuela del Conocimiento empieza con una más (Preparado)
const crMagia=d=>!!SUB[d.sub]?.sc; // las armas mágicas piden rasgo de Lanzamiento
function crFalta(d,k){
  if(k==="clase")return !d.clase?"Elige una clase.":!d.sub?"Elige una subclase.":"";
  if(k==="herencia")return !d.asc1?"Elige tu ascendencia.":d.mixta&&(!d.asc2||d.asc2===d.asc1)?"Con ascendencia mixta, elige otra ascendencia distinta para el segundo rasgo.":!d.com?"Elige tu comunidad.":"";
  if(k==="rasgos"){const v=RASGOS.map(([r])=>d.rasgos[r]);if(v.some(x=>x==null))return "Da un valor a los seis rasgos.";
    return JSON.stringify(v.slice().sort())===JSON.stringify(REPARTO.slice().sort())?"":"Reparte exactamente +2, +1, +1, +0, +0 y −1."}
  if(k==="equipo"){const p=T1[d.pri];return !p?"Elige un arma principal.":!T1[d.arm]?"Elige una armadura.":!d.item?"Elige tu objeto de clase.":""}
  if(k==="exp")return !d.exp.every(x=>x.trim())?"Escribe tus dos Experiencias.":d.sub==="bestia"&&!(d.compN||"").trim()?"Ponle nombre a tu compañero animal.":d.sub==="bestia"&&!(d.compExp||[]).every(x=>x.trim())?"Escribe las dos Experiencias de tu compañero.":"";
  if(k==="cartas")return d.cartas.length===crCartasN(d)?"":`Elige ${crCartasN(d)} cartas de nivel 1.`;

/* ---------- Subir de nivel ---------- */
function subNuevo(st){return {a:[],exp:"",carta:"",ctr:[]}}
const avCoste=S=>S.a.reduce((t,a)=>t+(AV[a.k].coste||1),0);
// Qué le falta a un avance elegido para estar completo
function avFalta(h,a,n){
  if(a.k==="rasgos")return (a.r||[]).length===2?"":"Elige dos rasgos.";
  if(a.k==="exp")return (a.i||[]).length===2?"":"Elige dos Experiencias.";
  if(a.k==="carta")return a.id?"":"Elige la carta.";
  if(a.k==="sub"&&h.sub==="conocimiento")return a.id?"":"Elige tu carta extra.";
  if(a.k==="multi")return a.clase&&a.dom&&a.sub?"":"Elige clase, dominio y subclase.";
  return "";
}
function subFalta(h,S,n){
  if([2,5,8].includes(n)&&!S.exp.trim())return "Escribe tu nueva Experiencia.";
  if(avCoste(S)!==2)return "Elige dos avances.";
  for(const a of S.a){const f=avFalta(h,a,n);if(f)return f}
  if(!S.carta)return "Elige tu carta de dominio nueva.";
  if(h.sub==="bestia"&&[2,5,8].includes(n)&&!(S.cexp||"").trim())return "Escribe la nueva Experiencia de tu compañero.";
  if(h.sub==="bestia"&&(S.ctr||[]).length!==ctrNecesarias(h,S))return "Elige el entrenamiento de tu compañero.";
  return "";
}

// Cartas de rasgos: clase, subclase, ascendencia y comunidad (featCard en js/cartas.js)

// Rejilla de cartas para elegir: L = [[valor, html]]; attr = atributo del botón

// Botón para leer una carta entera (las del creador son botones y su texto sale cortado)
const leerBtn=(id,sel)=>`<button class="crread" data-cread="${esc(id)}" data-csel="${esc(sel)}" aria-label="Leer entera «${esc(CARTA[id]?.n||id)}»">⤢ Leer</button>`;
function leerCarta(id,sel){const c=CARTA[id],tgt=sel&&document.querySelector(sel);
  // Las cartas de rasgos no están en CARTA: se copia la que hay en el botón
  const html=c?domainCard(c):tgt?.querySelector(".dh-card")?.outerHTML;if(!html)return;const ov=document.createElement("div");
  ov.className="rc-over";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-label",c?.n||tgt.querySelector("h4")?.textContent||"Carta");
  const pick=tgt&&!tgt.disabled;
  ov.innerHTML=`<div class="lc-box">${html.replace('class="dh-card','class="dh-card open')}
    <div class="btns"><button class="btn ghost" data-lc="no">Cerrar</button>${pick?`<button class="btn" data-lc="ok">${tgt.getAttribute("aria-pressed")==="true"?"Quitar":"Elegir"}</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  const fin=ok=>{document.removeEventListener("keydown",kd,true);ov.remove();if(ok)document.querySelector(sel)?.click()};
  const kd=e=>{if(e.key==="Escape"){e.stopPropagation();fin(false)}};document.addEventListener("keydown",kd,true);
  ov.addEventListener("click",e=>{const b=e.target.closest("[data-lc]");if(b)fin(b.dataset.lc==="ok");else if(e.target===ov)fin(false)});

// Ver una imagen entera, a todo el tamaño que quepa en la pantalla
function verImagen(src){if(!src)return;const ov=document.createElement("div");ov.className="rc-over zoomov";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-label","Imagen");
  ov.innerHTML=`<img alt=""><button class="btn ghost" aria-label="Cerrar">Cerrar</button>`;ov.querySelector("img").src=src;document.body.appendChild(ov);
  const fin=()=>{document.removeEventListener("keydown",kd,true);ov.remove()},kd=e=>{if(e.key==="Escape"){e.stopPropagation();fin()}};
  document.addEventListener("keydown",kd,true);ov.addEventListener("click",fin);ov.querySelector("button").focus()}
function pickCartas(h,n,attr,cur,ya){const L=cartasElegibles(h,n,ya.filter(x=>x!==cur));

// Casillas de un avance en cuadrados: usadas antes, elegidas ahora, libres y tachadas (no disponibles)
function avSlots(h,k,n,S){const T=tierDe(n);let tot=0;for(let t=2;t<=T;t++)if((AV[k].min||2)<=t)tot+=CASILLAS[k];
  const usadas=avancesDe(h).filter(a=>a.k===k&&a.t<=T).length,ahora=S.a.filter(x=>x.k===k).length,libres=Math.max(0,casillasLibres(h,k,n)-ahora),
    tach=Math.max(0,tot-usadas-ahora-libres),q=(c,nn)=>Array.from({length:nn},()=>`<i class="sl ${c}"></i>`).join("");
  return `<span class="avsl" title="${usadas} usada(s), ${ahora} ahora, ${libres} libre(s)">${q("us",usadas)}${q("now",ahora)}${q("",libres)}${q("x",tach)}</span>`}
function viewSubir(st){
  const h=st.hojas[ui.me],n=h.nivel+1,S=ui.subir,T=tierDe(n),k=calcHoja(st,ui.me);

  const cost=avCoste(S),marc=rasgosMarcados(h,n),otros=new Set(S.a.filter(a=>a.k==="rasgos").flatMap(a=>a.r||[]));
  const ya=[S.carta,...S.a.map(a=>a.id)].filter(Boolean);
  const exps=[...h.exp.map(e=>e.n),...([2,5,8].includes(n)?[S.exp.trim()||"Nueva experiencia"]:[])];
  const det=(a,i)=>{
    if(a.k==="rasgos")return `<div class="btns">${RASGOS.map(([r,nm])=>{const on=(a.r||[]).includes(r),bloq=marc.has(r)||(!on&&otros.has(r));

    if(a.k==="carta"||(a.k==="sub"&&h.sub==="conocimiento"))return pickCartas(h,n,`data-scarta="${i}" data-v`,a.id,ya);
    if(a.k==="sub"){const sb=SUB[h.sub],ns=nivelSub(h);const F=ns===1?sb.esp:sb.mae;return `<div class="crsubf">${F.map(feat).join("")}</div>`}

function viewCompendio(st){

    return `<div class="cfac"><span>${f[1]}</span><button class="chip" data-cfac="${f[0]}" data-v="" aria-pressed="${!fv[f[0]]}">Todos</button>${opts.map(([v,l])=>`<button class="chip" data-cfac="${f[0]}" data-v="${esc(v)}" aria-pressed="${fv[f[0]]===String(v)}">${esc(l)}</button>`).join("")}</div>`}).join("");
  const nf=Object.values(fv).filter(Boolean).length;
  const bar=`<div class="cbar"><div class="chips">${CCOLS.map(([k,l])=>`<button class="chip" data-ccol="${k}" aria-pressed="${k===col}">${l}</button>`).join("")}</div>

    ${facs?`<div class="cfacs">${facs}${nf?`<button class="linkbtn" data-cfclear>Quitar filtros</button>`:""}</div>`:""}</div>`;
  // Secciones: por tier y tipo, o por tipo y rareza; lo retirado al final

    <div class="${big?"cards ccards":"ctlist ccards"}">${g.it.map(it=>`<div class="cpick${it.borrado?" off":""}${it.id===ui.cid?" sel":""}" data-cpick="${esc(it.id)}" role="button" tabindex="0" aria-label="Editar ${esc(it.n)}">${compCard(col,it)}</div>`).join("")}</div>`).join("");

// Cargar los resúmenes del vault (data/sesiones-vault.json). No pisa lo que ya esté escrito en la web.

let drag=null,noClick=false;
document.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tile[data-drag],[data-cdrag]");if(!t||ui.busy||e.button>0)return;
  const card=t.dataset.cdrag;
  drag={t,card,ref:card||t.dataset.ref,fits:t.dataset.fits,where:t.dataset.where,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,
    timer:e.pointerType==="touch"?setTimeout(()=>{if(drag&&!drag.on)startDrag(drag.x,drag.y)},260):0,touch:e.pointerType==="touch"};
});
function startDrag(x,y){
  drag.on=true;const r=drag.t.getBoundingClientRect(),g=drag.t.cloneNode(true);
  g.className=(drag.card?"slotcard":"tile")+" ghost";g.style.width=r.width+"px";document.body.appendChild(g);drag.g=g;drag.ox=r.width/2;drag.oy=Math.min(r.height/2,60);moveGhost(x,y);
  if(drag.card){document.querySelector(`.cdrop[data-drop="${drag.where==="uso"?"baul":"uso"}"]`)?.classList.add("can");drag.t.classList.add("lifted");return}
  document.querySelectorAll(`.eslot[data-drop="${drag.fits}"]`).forEach(s=>s.classList.add("can"));
  if(drag.where!=="lista")document.querySelector('.tiles[data-drop="lista"]')?.classList.add("can");
}
function moveGhost(x,y){drag.g.style.transform=`translate(${x-drag.ox}px,${y-drag.oy}px)`;drag.x=x;drag.y=y;
  document.querySelectorAll("[data-drop].over").forEach(z=>z.classList.remove("over"));
  drag.g.hidden=true;const z=document.elementFromPoint(x,y)?.closest("[data-drop].can");drag.g.hidden=false;if(z)z.classList.add("over")}

  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){const far=Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6;
    if(drag.touch){if(far){clearTimeout(drag.timer);drag=null}return}
    if(far)startDrag(e.clientX,e.clientY);else return}
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener("touchmove",e=>{if(drag?.on)e.preventDefault()},{passive:false});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;clearTimeout(drag.timer);const d=drag;drag=null;
  if(!d.on)return;noClick=true;setTimeout(()=>noClick=false,50);
  d.g.hidden=true;const z=document.elementFromPoint(d.x,d.y)?.closest("[data-drop].can");d.g.remove();

  if(!z)return;const to=z.dataset.drop;
  if(d.card){if(to!==d.where)act(st=>A.hoja(st,ui.me,h=>{const id=d.card;
    if(to==="uso"){if(h.cartas.length>=5)no("Ya tienes 5 cartas en la mano: guarda antes una en el baúl.");h.baul=h.baul.filter(x=>x!==id);h.cartas.push(id)}
    else{h.cartas=h.cartas.filter(x=>x!==id);h.baul.push(id)}}),to==="uso"?"A la mano.":"Al baúl.");return}
  if(to==="lista"){if(d.where!=="lista")act(st=>A.slot(st,ui.me,d.ref,null))}

  if(t.dataset?.hexp!==undefined){const i=+t.dataset.hexp,v=t.value.slice(0,60);act(st=>A.hoja(st,ui.me,h=>{if(h.exp[i])h.exp[i].n=v}),"Guardado.");return}
  if(t.dataset?.lvis)act(st=>A.lugar(st,t.dataset.lvis,{visible:t.checked}),t.checked?"Lugar visible.":"Lugar oculto.");
});

// El DM entra con su contraseña; la sesión la guarda Firebase en este navegador
/* Vista previa de los enlaces [[…]]: al pasar el ratón sale la ficha; si se mantiene 1,5 s se queda fija
   (se puede mover por la cabecera y leer con calma). Solo con ratón; en táctil el toque sigue abriendo el Mundo. */
const Peek=(()=>{
  const root=$("#peeks"),HOLD=1500;let cur=null; // cur: {a,el,ring,t}
  function html(id){
    const e=mundoEntries()[id];if(!e)return null;const E=mundoEntries();
    const link=(t,txt)=>E[t]?`<button class="lk" data-ent="${t}">${esc(txt)}</button>`:`<span class="lk off">${esc(txt)}</span>`;
    return `<div class="whead"><b>${esc(e.n)}</b><button class="wx pclose" data-pclose aria-label="Cerrar">✕</button></div>
     <div class="wbody">${e.img?`<img class="wimg" src="${e.img}" alt="">`:""}${e.sub?`<p class="note psub">${esc(e.sub)}</p>`:""}${e.estado?`<p class="note">${mdIn(e.estado,link)}</p>`:""}<article class="prose">${mdHTML(e.txt||"",link)||`<p class="note">Sin más datos.</p>`}</article>
     <div class="btns"><button class="btn ghost" data-ent="${id}">Abrir en el Mundo</button></div></div>`;
  }
  function place(el,a){
    const r=a.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+8;
    if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
    el.style.left=x+"px";el.style.top=y+"px";
  }
  function stop(){if(!cur)return;clearTimeout(cur.t);cur.el?.remove();cur.ring?.remove();cur=null}
  function start(a,ev){
    const h=html(a.dataset.ent);if(!h)return;
    const el=document.createElement("div");el.className="peek";el.innerHTML=h;root.append(el);place(el,a);
    const ring=document.createElement("div");ring.className="peekring";ring.innerHTML=`<svg viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="10"/><circle class="fg" cx="14" cy="14" r="10"/></svg>`;
    ring.style.left=ev.clientX+"px";ring.style.top=ev.clientY+"px";document.body.append(ring);
    cur={a,el,ring,t:setTimeout(()=>{el.classList.add("pin");ring.remove();cur=null},HOLD)};
  }
  document.addEventListener("pointerover",ev=>{
    if(ev.pointerType!=="mouse")return;
    const a=ev.target.closest?.(".lk[data-ent]");if(!a||cur?.a===a)return;
    stop();start(a,ev);
  });
  document.addEventListener("pointerout",ev=>{if(cur&&!cur.a.contains(ev.relatedTarget))stop()});
  document.addEventListener("pointermove",ev=>{if(cur?.ring){cur.ring.style.left=ev.clientX+"px";cur.ring.style.top=ev.clientY+"px"}});
  document.addEventListener("pointerdown",ev=>{if(cur&&cur.a.contains(ev.target))stop()}); // al hacer clic manda el clic
  // Fijas: arrastrar por la cabecera, traer al frente, cerrar con ✕ o Esc
  root.addEventListener("pointerdown",ev=>{
    const el=ev.target.closest(".peek.pin");if(!el)return;root.append(el);
    if(ev.target.closest("[data-pclose]")){el.remove();return}
    const hd=ev.target.closest(".whead");if(!hd)return;
    const r=el.getBoundingClientRect(),dx=ev.clientX-r.left,dy=ev.clientY-r.top;hd.setPointerCapture(ev.pointerId);
    const mv=e=>{el.style.left=Math.min(Math.max(0,e.clientX-dx),innerWidth-60)+"px";el.style.top=Math.min(Math.max(0,e.clientY-dy),innerHeight-40)+"px"};
    const up=()=>{hd.removeEventListener("pointermove",mv);hd.removeEventListener("pointerup",up)};
    hd.addEventListener("pointermove",mv);hd.addEventListener("pointerup",up);
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){const p=root.querySelector(".peek.pin:last-child");if(p)p.remove()}});
  return {stop,clear(){stop();root.innerHTML=""}};
})();
